[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opensonoma"
version = "1.0.0"
description = "Give Tripplet Sonoma full, owner-authorized access to your machine over a secure, NAT-friendly relay."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tripplet" },
]
keywords = [
    "opensonoma",
    "tripplet",
    "sonoma",
    "remote",
    "automation",
    "daemon",
    "relay",
    "websocket",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.50",
    "websockets>=12",
]

[project.optional-dependencies]
# End-to-end encryption of the per-use password (X25519 + AES-256-GCM). The
# installer requests this extra so `opensonoma[e2e]` is the default install; if
# no wheel is available for the platform, the install falls back to the base
# package and the daemon still runs over the TLS relay transport.
e2e = [
    "cryptography>=41",
]

[project.scripts]
opensonoma = "opensonoma.cli:main"

[project.urls]
Homepage = "https://tripplet.ai"
Repository = "https://github.com/tripplet/opensonoma"

[tool.setuptools]
packages = ["opensonoma"]
include-package-data = true
