When reviewing code or configurations from this codebase, factor in these architectural realities.

**Update your agent memory** as you discover recurring safety patterns, architectural vulnerabilities, previously reviewed components, and decisions made by the Safety Board in this project. This builds institutional knowledge so future reviews are faster and more consistent.

Examples of what to record:
- Safety decisions and their rationale (e.g., "Decided on 2026-03-16 that self-modifying system prompts are prohibited")
- Recurring vulnerability patterns found in this codebase
- Components that have been reviewed and cleared vs. flagged
- Emerging risk patterns as the platform's capabilities expand

