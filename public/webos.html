                        <span>This PC</span>
                    </div>
                </div>
                <div class="file-manager-main">
                    <div class="file-manager-toolbar">
                        <div class="file-manager-nav-btn" id="fm-back" onclick="Apps.FileManager.goBack()">←</div>
                        <div class="file-manager-nav-btn" id="fm-forward" onclick="Apps.FileManager.goForward()">→</div>
                        <div class="file-manager-nav-btn" onclick="Apps.FileManager.navigate(Apps.FileManager.currentPath)">↻</div>
                        <div class="file-manager-path" id="fm-path"></div>
                        <div class="file-manager-view-btn active" id="fm-view-grid" onclick="Apps.FileManager.setView('grid')">▦</div>
                        <div class="file-manager-view-btn" id="fm-view-list" onclick="Apps.FileManager.setView('list')">☰</div>
                    </div>
                    <div class="file-manager-content" id="fm-content"></div>
                    <div class="file-manager-statusbar" id="fm-status"></div>
                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        this.navigate('/');
    },
    
    navigate(path) {
        this.currentPath = path;
        
        // Update history
        if (this.history[this.historyIndex] !== path) {
            this.history = this.history.slice(0, this.historyIndex + 1);
            this.history.push(path);
            this.historyIndex = this.history.length - 1;
        }
        
        this.updatePath();
        this.updateContent();
        this.updateNavButtons();
        this.updateSidebar();
    },
    
    updatePath() {
        const pathEl = document.getElementById('fm-path');
        if (!pathEl) return;
        
        const segments = this.currentPath.split('/').filter(s => s);
        let html = `<span class="file-manager-path-segment" onclick="Apps.FileManager.navigate('/')">🏠 Home</span>`;
        
        let currentPath = '';
        segments.forEach((segment, i) => {
            currentPath += '/' + segment;
            const path = currentPath;
            html += `<span class="file-manager-path-separator">›</span>`;
            html += `<span class="file-manager-path-segment" onclick="Apps.FileManager.navigate('${path}')">${segment}</span>`;
        });
        
        pathEl.innerHTML = html;
    },
    
    updateContent() {
        const contentEl = document.getElementById('fm-content');
        if (!contentEl) return;
        
        const folder = ZenOS.fileSystem[this.currentPath];
        if (!folder || folder.type !== 'folder') {
            contentEl.innerHTML = '<div style="padding: 40px; text-align: center; color: rgba(255,255,255,0.5);">This folder is empty</div>';
            return;
        }
        
        const children = folder.children || [];
        const statusEl = document.getElementById('fm-status');
        if (statusEl) statusEl.textContent = `${children.length} item${children.length !== 1 ? 's' : ''}`;
        
        if (children.length === 0) {
            contentEl.innerHTML = '<div style="padding: 40px; text-align: center; color: rgba(255,255,255,0.5);">This folder is empty</div>';
            return;
        }
        
        if (this.viewMode === 'grid') {
            contentEl.innerHTML = `<div class="file-manager-grid">${children.map(name => {
                const childPath = this.currentPath === '/' ? '/' + name : this.currentPath + '/' + name;
                const child = ZenOS.fileSystem[childPath];
                const isFolder = child && child.type === 'folder';
                const icon = isFolder ? '📁' : this.getFileIcon(name);
                return `
                    <div class="file-manager-grid-item" data-path="${childPath}" data-name="${name}"
                         onclick="Apps.FileManager.selectItem(this)"
                         ondblclick="Apps.FileManager.openItem('${childPath}', ${isFolder})">
                        <div class="file-manager-grid-item-icon">${icon}</div>
                        <div class="file-manager-grid-item-name">${name}</div>
                    </div>
                `;
            }).join('')}</div>`;
        } else {
            contentEl.innerHTML = `
                <div class="file-manager-list">
                    <div class="file-manager-list-header">
                        <span></span>
                        <span>Name</span>
                        <span>Date Modified</span>
                        <span>Size</span>
                        <span>Type</span>
                    </div>
                    ${children.map(name => {
                        const childPath = this.currentPath === '/' ? '/' + name : this.currentPath + '/' + name;
                        const child = ZenOS.fileSystem[childPath];
                        const isFolder = child && child.type === 'folder';
                        const icon = isFolder ? '📁' : this.getFileIcon(name);
                        const size = child && child.size ? child.size : '--';
                        const type = isFolder ? 'Folder' : this.getFileType(name);
                        return `
                            <div class="file-manager-list-item" data-path="${childPath}" data-name="${name}"
                                 onclick="Apps.FileManager.selectItem(this)"
                                 ondblclick="Apps.FileManager.openItem('${childPath}', ${isFolder})">
                                <span class="file-manager-list-item-icon">${icon}</span>
                                <span class="file-manager-list-item-name">${name}</span>
                                <span class="file-manager-list-item-date">Today</span>
                                <span class="file-manager-list-item-size">${size}</span>
                                <span class="file-manager-list-item-type">${type}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
    },
    
    getFileIcon(name) {
        const ext = name.split('.').pop().toLowerCase();
        const icons = {
            'txt': '📝', 'js': '📜', 'html': '🌐', 'css': '🎨',
            'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
            'mp3': '🎵', 'wav': '🎵', 'm3u': '🎶',
            'mp4': '🎬', 'avi': '🎬', 'mov': '🎬',
            'pdf': '📕', 'doc': '📘', 'docx': '📘',
            'zip': '📦', 'rar': '📦', 'exe': '⚙️'
        };
        return icons[ext] || '📄';
    },
    
    getFileType(name) {
        const ext = name.split('.').pop().toLowerCase();
        const types = {
            'txt': 'Text Document', 'js': 'JavaScript', 'html': 'HTML Document',
            'css': 'CSS Stylesheet', 'jpg': 'JPEG Image', 'jpeg': 'JPEG Image',
            'png': 'PNG Image', 'gif': 'GIF Image', 'mp3': 'MP3 Audio',
            'wav': 'WAV Audio', 'm3u': 'Playlist', 'mp4': 'MP4 Video',
            'avi': 'AVI Video', 'pdf': 'PDF Document', 'zip': 'ZIP Archive'
        };
        return types[ext] || 'File';
    },
    
    selectItem(el) {
        const container = el.closest('.file-manager-content');
        container.querySelectorAll('.file-manager-grid-item, .file-manager-list-item').forEach(i => {
            i.classList.remove('selected');
        });
        el.classList.add('selected');
    },
    
    openItem(path, isFolder) {
        if (isFolder) {
            this.navigate(path);
        } else {
            const file = ZenOS.fileSystem[path];
            if (file) {
                const name = path.split('/').pop();
                const ext = name.split('.').pop().toLowerCase();
                
                if (['txt', 'js', 'html', 'css'].includes(ext)) {
                    AppManager.open('text-editor');
                    setTimeout(() => {
                        Apps.TextEditor.loadContent(file.content, name);
                    }, 200);
                } else if (['jpg', 'jpeg', 'png', 'gif'].includes(ext)) {
                    AppManager.open('photo-viewer');
                } else {
                    Toast.show('Open File', `Opening ${name}...`, 'info');
                }
            }
        }
    },
    
    setView(mode) {
        this.viewMode = mode;
        document.getElementById('fm-view-grid').classList.toggle('active', mode === 'grid');
        document.getElementById('fm-view-list').classList.toggle('active', mode === 'list');
        this.updateContent();
    },
    
    goBack() {
        if (this.historyIndex > 0) {
            this.historyIndex--;
            this.currentPath = this.history[this.historyIndex];
            this.updatePath();
            this.updateContent();
            this.updateNavButtons();
        }
    },
    
    goForward() {
        if (this.historyIndex < this.history.length - 1) {
            this.historyIndex++;
            this.currentPath = this.history[this.historyIndex];
            this.updatePath();
            this.updateContent();
            this.updateNavButtons();
        }
    },
    
    updateNavButtons() {
        const backBtn = document.getElementById('fm-back');
        const forwardBtn = document.getElementById('fm-forward');
        if (backBtn) backBtn.classList.toggle('disabled', this.historyIndex <= 0);
        if (forwardBtn) forwardBtn.classList.toggle('disabled', this.historyIndex >= this.history.length - 1);
    },
    
    updateSidebar() {
        document.querySelectorAll('.file-manager-sidebar-item').forEach(item => {
            const path = item.dataset.path;
            item.classList.toggle('active', path === this.currentPath);
        });
    },
    
    showDrives() {
        Toast.show('This PC', 'Local Disk (C:) - 256 GB (128 GB free)', 'info');
    }
};

Apps.TextEditor = {
    currentFile: 'Untitled.txt',

    getHTML() {

                    <div class="text-editor-tool-separator"></div>
                    <div class="text-editor-tool-btn" onclick="Apps.TextEditor.zoomIn()" title="Zoom In">➕</div>
                    <div class="text-editor-tool-btn" onclick="Apps.TextEditor.zoomOut()" title="Zoom Out">➖</div>
                </div>
                <textarea class="text-editor-textarea" id="te-textarea" placeholder="Start typing..." spellcheck="false"></textarea>
                <div class="text-editor-statusbar">
                    <span id="te-filename">Untitled.txt</span>
                    <span id="te-line-col">Ln 1, Col 1</span>
                    <span id="te-characters">0 characters</span>
                    <span id="te-lines">0 lines</span>
                    <span>UTF-8</span>
                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        const textarea = document.getElementById('te-textarea');
        if (textarea) {
            textarea.addEventListener('input', () => this.updateStats());
            textarea.addEventListener('click', () => this.updateStats());
            textarea.addEventListener('keyup', () => this.updateStats());
            textarea.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    this.saveFile();
                }
                if (e.ctrlKey && e.key === 'n') {
                    e.preventDefault();
                    this.newFile();
                }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    textarea.value = textarea.value.substring(0, start) + '    ' + textarea.value.substring(end);
                    textarea.selectionStart = textarea.selectionEnd = start + 4;
                }
            });
        }
    },
    
    loadContent(content, filename) {
        const textarea = document.getElementById('te-textarea');
        if (textarea) {
            textarea.value = content;
            this.currentFile = filename || 'Untitled.txt';
            document.getElementById('te-filename').textContent = this.currentFile;
            this.updateStats();
        }
    },
    
    updateStats() {
        const textarea = document.getElementById('te-textarea');
        if (!textarea) return;
        
        const text = textarea.value;
        const lines = text.split('\n');
        const cursorPos = textarea.selectionStart;
        
        let line = 1, col = 1;
        for (let i = 0; i < cursorPos; i++) {
            if (text[i] === '\n') {
                line++;
                col = 1;
            } else {
                col++;
            }
        }
        
        document.getElementById('te-line-col').textContent = `Ln ${line}, Col ${col}`;
        document.getElementById('te-characters').textContent = `${text.length} characters`;
        document.getElementById('te-lines').textContent = `${lines.length} lines`;
    },
    
    newFile() {
        if (this.isModified) {
            Dialog.confirm('New File', 'You have unsaved changes. Create new file anyway?', () => {
                this.clearFile();
            });
        } else {
            this.clearFile();
        }
    },
    
    clearFile() {
        const textarea = document.getElementById('te-textarea');
        if (textarea) {
            textarea.value = '';
            this.currentFile = 'Untitled.txt';
            document.getElementById('te-filename').textContent = this.currentFile;
            this.isModified = false;
            this.updateStats();
        }
    },
    
    saveFile() {
        const textarea = document.getElementById('te-textarea');
        if (!textarea) return;
        
        const content = textarea.value;
        localStorage.setItem(`zenos-file-${this.currentFile}`, content);
        this.isModified = false;
        Toast.show('File Saved', `${this.currentFile} has been saved.`, 'success');
    },
    
    openFile() {
        Dialog.prompt('Open File', 'Enter filename to open:', '', (filename) => {
            if (filename) {
                const content = localStorage.getItem(`zenos-file-${filename}`);
                if (content !== null) {
                    this.loadContent(content, filename);
                } else {
                    Toast.show('File Not Found', `Could not find file: ${filename}`, 'error');
                }
            }
        });
    },
    
    undo() { document.execCommand('undo'); },
    redo() { document.execCommand('redo'); },
    
    find() {
        const textarea = document.getElementById('te-textarea');
        if (!textarea) return;
        Dialog.prompt('Find', 'Enter text to find:', '', (query) => {
            if (query) {
                const text = textarea.value;
                const index = text.indexOf(query, textarea.selectionEnd);
                if (index !== -1) {
                    textarea.focus();
                    textarea.selectionStart = index;
                    textarea.selectionEnd = index + query.length;
                } else {
                    Toast.show('Not Found', `"${query}" was not found in the document.`, 'info');
                }
            }
        });
    },
    
    replaceAll() {
        const textarea = document.getElementById('te-textarea');
        if (!textarea) return;
        Dialog.prompt('Replace', 'Enter text to find:', '', (findText) => {
            if (findText) {
                Dialog.prompt('Replace', `Replace "${findText}" with:`, '', (replaceText) => {
                    const regex = new RegExp(findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
                    textarea.value = textarea.value.replace(regex, replaceText);
                    this.updateStats();
                    Toast.show('Replace Complete', `All occurrences of "${findText}" replaced.`, 'success');
                });
            }
        });
    },
    
    wordWrap() {
        const textarea = document.getElementById('te-textarea');
        if (textarea) {
            textarea.style.whiteSpace = textarea.style.whiteSpace === 'nowrap' ? 'pre-wrap' : 'nowrap';
        }
    },
    
    zoomIn() {
        const textarea = document.getElementById('te-textarea');
        if (textarea) {
            const current = parseInt(getComputedStyle(textarea).fontSize);
            textarea.style.fontSize = (current + 2) + 'px';
        }
    },
    
    zoomOut() {
        const textarea = document.getElementById('te-textarea');
        if (textarea) {
            const current = parseInt(getComputedStyle(textarea).fontSize);
            textarea.style.fontSize = Math.max(10, current - 2) + 'px';
        }
    },
    
    showHelp() {
        Dialog.show('Help', `
            <p><strong>ZenOS Text Editor</strong></p>
            <p>Keyboard shortcuts:</p>
            <ul style="padding-left: 20px; margin-top: 10px;">
                <li>Ctrl+S - Save file</li>
                <li>Ctrl+N - New file</li>
                <li>Ctrl+Z - Undo</li>
                <li>Ctrl+Y - Redo</li>
                <li>Tab - Insert spaces</li>
            </ul>
        `);
    }
};

Apps.Calculator = {
    display: '0',
    history: '',
    operator: null,
    waitingForOperand: false,
    memory: 0,
    
    getHTML() {
        return `
            <div class="calculator">
                <div class="calculator-display">
                    <div class="calculator-history" id="calc-history"></div>
                    <div class="calculator-result" id="calc-result">0</div>
                </div>
                <div class="calculator-buttons">
                    <button class="calculator-btn function" onclick="Apps.Calculator.clearAll()">C</button>
                    <button class="calculator-btn function" onclick="Apps.Calculator.clearEntry()">CE</button>
                    <button class="calculator-btn function" onclick="Apps.Calculator.backspace()">⌫</button>
                    <button class="calculator-btn operator" onclick="Apps.Calculator.setOperator('/')">÷</button>
                    
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('7')">7</button>
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('8')">8</button>
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('9')">9</button>
                    <button class="calculator-btn operator" onclick="Apps.Calculator.setOperator('*')">×</button>
                    
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('4')">4</button>
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('5')">5</button>
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('6')">6</button>
                    <button class="calculator-btn operator" onclick="Apps.Calculator.setOperator('-')">−</button>
                    
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('1')">1</button>
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('2')">2</button>
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('3')">3</button>
                    <button class="calculator-btn operator" onclick="Apps.Calculator.setOperator('+')">+</button>
                    
                    <button class="calculator-btn function" onclick="Apps.Calculator.toggleSign()">±</button>
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDigit('0')">0</button>
                    <button class="calculator-btn" onclick="Apps.Calculator.inputDecimal()">.</button>
                    <button class="calculator-btn equals" onclick="Apps.Calculator.calculate()">=</button>
                </div>
            </div>
        `;
    },
    
    init() { this.updateDisplay(); },
    
    inputDigit(digit) {
        if (this.waitingForOperand) {
            this.display = digit;
            this.waitingForOperand = false;
        } else {
            this.display = this.display === '0' ? digit : this.display + digit;
        }
        this.updateDisplay();
    },
    
    inputDecimal() {
        if (this.waitingForOperand) {
            this.display = '0.';
            this.waitingForOperand = false;
            this.updateDisplay();
            return;
        }
        if (!this.display.includes('.')) {
            this.display += '.';
        }
        this.updateDisplay();
    },
    
    clearAll() {
        this.display = '0';
        this.history = '';
        this.operator = null;
        this.waitingForOperand = false;
        this.previousOperand = null;
        this.updateDisplay();
    },
    
    clearEntry() {
        this.display = '0';
        this.updateDisplay();
    },
    
    backspace() {        this.display = this.display.length > 1 ? this.display.slice(0, -1) : '0';
        this.updateDisplay();
    },
    
    toggleSign() {
        if (this.display === '0') return;
        this.display = this.display.charAt(0) === '-' ? this.display.slice(1) : '-' + this.display;
        this.updateDisplay();
    },
    
    setOperator(op) {
        const inputValue = parseFloat(this.display);
        
        if (this.operator && !this.waitingForOperand) {
            const currentValue = parseFloat(this.previousOperand);
            const result = this.performCalc(currentValue, inputValue, this.operator);
            this.display = String(result);
            this.previousOperand = String(result);
        } else {
            this.previousOperand = String(inputValue);
        }
        
        this.operator = op;
        this.waitingForOperand = true;
        this.history = this.display + ' ' + this.getOperatorSymbol(op);
        this.updateDisplay();
    },
    
    getOperatorSymbol(op) {
        const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
        return symbols[op] || op;
    },
    
    performCalc(a, b, op) {
        switch (op) {
            case '+': return a + b;
            case '-': return a - b;
            case '*': return a * b;
            case '/': return b === 0 ? 'Error' : a / b;
            default: return b;
        }
    },
    
    calculate() {
        if (!this.operator || this.waitingForOperand) return;
        
        const inputValue = parseFloat(this.display);
        const currentValue = parseFloat(this.previousOperand);
        const result = this.performCalc(currentValue, inputValue, this.operator);
        
        this.history = this.previousOperand + ' ' + this.getOperatorSymbol(this.operator) + ' ' + this.display + ' =';
        this.display = String(result);
        this.operator = null;
        this.previousOperand = null;
        this.waitingForOperand = true;
        this.updateDisplay();
    },
    
    updateDisplay() {
        const resultEl = document.getElementById('calc-result');
        const historyEl = document.getElementById('calc-history');
        if (resultEl) {
            let displayVal = this.display;
            if (displayVal.length > 12) {
                const num = parseFloat(displayVal);
                displayVal = num.toExponential(6);
            }
            resultEl.textContent = displayVal;
        }
        if (historyEl) historyEl.textContent = this.history;
    }
};

                    <div class="paint-tool-separator"></div>
                    <div class="paint-size-control">
                        <span style="font-size: 11px; color: rgba(255,255,255,0.5);">Size:</span>
                        <input type="range" class="paint-size-slider" id="paint-size" min="1" max="50" value="5" oninput="Apps.Paint.setSize(this.value)">
                        <span class="paint-size-label" id="paint-size-label">5</span>
                    </div>
                    <div class="paint-tool-separator"></div>
                    <div class="paint-tool-btn" onclick="Apps.Paint.undo()" title="Undo">↩️</div>
                    <div class="paint-tool-btn" onclick="Apps.Paint.redo()" title="Redo">↪️</div>
                    <div class="paint-tool-btn" onclick="Apps.Paint.clearCanvas()" title="Clear">🗑️</div>
                    <div class="paint-tool-btn" onclick="Apps.Paint.saveImage()" title="Save">💾</div>
                </div>
                <div class="paint-canvas-container">
                    <canvas class="paint-canvas" id="paint-canvas" width="800" height="500"></canvas>
                </div>
                <div class="paint-statusbar">
                    <span id="paint-tool-status">Tool: Brush</span>
                    <span id="paint-position">X: 0, Y: 0</span>
                    <span>Canvas: 800 × 500</span>
                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        this.canvas = document.getElementById('paint-canvas');
        this.ctx = this.canvas.getContext('2d');
        
        // Fill white background
        this.ctx.fillStyle = '#ffffff';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        this.saveState();
        
        // Setup color swatches
        const colorContainer = document.getElementById('paint-colors');
        if (colorContainer) {
            colorContainer.innerHTML = this.colors.map(c => `
                <div class="paint-color-swatch ${c === this.color ? 'active' : ''}" 
                     style="background: ${c};" 
                     data-color="${c}" 
                     onclick="Apps.Paint.setColor('${c}')"></div>
            `).join('');
        }
        
        // Canvas events
        this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
        this.canvas.addEventListener('mousemove', (e) => this.draw(e));
        this.canvas.addEventListener('mouseup', () => this.stopDrawing());
        this.canvas.addEventListener('mouseout', () => this.stopDrawing());
        
        this.canvas.addEventListener('mousemove', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            const posEl = document.getElementById('paint-position');
            if (posEl) posEl.textContent = `X: ${x}, Y: ${y}`;
        });
    },
    
    setTool(tool) {
        this.tool = tool;
        document.querySelectorAll('.paint-tool-btn[data-tool]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tool === tool);
        });
        const statusEl = document.getElementById('paint-tool-status');
        if (statusEl) statusEl.textContent = `Tool: ${tool.charAt(0).toUpperCase() + tool.slice(1)}`;
    },
    
    setColor(color) {
        this.color = color;
        document.querySelectorAll('.paint-color-swatch').forEach(s => {
            s.classList.toggle('active', s.dataset.color === color);
        });
    },
    
    setSize(size) {
        this.size = parseInt(size);
        document.getElementById('paint-size-label').textContent = size;
    },
    
    getCanvasCoords(e) {
        const rect = this.canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    },
    
    startDrawing(e) {
        this.isDrawing = true;
        const coords = this.getCanvasCoords(e);
        this.lastX = coords.x;
        this.lastY = coords.y;
        this.startX = coords.x;
        this.startY = coords.y;
        
        if (this.tool === 'fill') {
            this.floodFill(Math.floor(coords.x), Math.floor(coords.y), this.color);
            this.saveState();
            this.isDrawing = false;
        } else if (this.tool === 'picker') {
            const pixel = this.ctx.getImageData(Math.floor(coords.x), Math.floor(coords.y), 1, 1).data;
            const color = '#' + [pixel[0], pixel[1], pixel[2]].map(x => x.toString(16).padStart(2, '0')).join('');
            this.setColor(color);
            this.isDrawing = false;
        } else if (this.tool === 'text') {
            Dialog.prompt('Text Tool', 'Enter text to add:', 'Hello', (text) => {
                if (text) {
                    this.ctx.font = `${this.size * 4}px Arial`;
                    this.ctx.fillStyle = this.color;
                    this.ctx.fillText(text, coords.x, coords.y);
                    this.saveState();
                }
            });
            this.isDrawing = false;
        } else if (this.tool === 'brush' || this.tool === 'eraser') {
            this.ctx.beginPath();
            this.ctx.arc(coords.x, coords.y, this.size / 2, 0, Math.PI * 2);
            this.ctx.fillStyle = this.tool === 'eraser' ? '#ffffff' : this.color;
            this.ctx.fill();
        }
        
        // Save snapshot for shape tools
        if (['line', 'rect', 'circle'].includes(this.tool)) {
            this.snapshot = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
        }
    },
    
    draw(e) {
        if (!this.isDrawing) return;
        const coords = this.getCanvasCoords(e);
        
        if (this.tool === 'brush' || this.tool === 'eraser') {
            this.ctx.beginPath();
            this.ctx.moveTo(this.lastX, this.lastY);
            this.ctx.lineTo(coords.x, coords.y);
            this.ctx.strokeStyle = this.tool === 'eraser' ? '#ffffff' : this.color;
            this.ctx.lineWidth = this.size;
            this.ctx.lineCap = 'round';
            this.ctx.lineJoin = 'round';
            this.ctx.stroke();
        } else if (this.tool === 'line') {
            this.ctx.putImageData(this.snapshot, 0, 0);
            this.ctx.beginPath();
            this.ctx.moveTo(this.startX, this.startY);
            this.ctx.lineTo(coords.x, coords.y);
            this.ctx.strokeStyle = this.color;
            this.ctx.lineWidth = this.size;
            this.ctx.lineCap = 'round';
            this.ctx.stroke();
        } else if (this.tool === 'rect') {
            this.ctx.putImageData(this.snapshot, 0, 0);
            this.ctx.strokeStyle = this.color;
            this.ctx.lineWidth = this.size;
            this.ctx.strokeRect(this.startX, this.startY, coords.x - this.startX, coords.y - this.startY);
        } else if (this.tool === 'circle') {
            this.ctx.putImageData(this.snapshot, 0, 0);
            const rx = Math.abs(coords.x - this.startX) / 2;
            const ry = Math.abs(coords.y - this.startY) / 2;
            const cx = this.startX + (coords.x - this.startX) / 2;
            const cy = this.startY + (coords.y - this.startY) / 2;
            this.ctx.beginPath();
            this.ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            this.ctx.strokeStyle = this.color;
            this.ctx.lineWidth = this.size;
            this.ctx.stroke();
        }
        
        this.lastX = coords.x;
        this.lastY = coords.y;
    },
    
    stopDrawing() {
        if (this.isDrawing) {
            this.isDrawing = false;
            this.saveState();
        }
    },
    
    saveState() {
        this.historyIndex++;
        this.history = this.history.slice(0, this.historyIndex);
        this.history.push(this.canvas.toDataURL());
        if (this.history.length > 30) {
            this.history.shift();
            this.historyIndex--;
        }
    },
    
    undo() {
        if (this.historyIndex > 0) {
            this.historyIndex--;
            this.restoreState();
        }
    },
    
    redo() {
        if (this.historyIndex < this.history.length - 1) {
            this.historyIndex++;
            this.restoreState();
        }
    },
    
    restoreState() {
        const img = new Image();
        img.onload = () => {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.ctx.drawImage(img, 0, 0);
        };
        img.src = this.history[this.historyIndex];
    },
    
    clearCanvas() {
        Dialog.confirm('Clear Canvas', 'Are you sure you want to clear the entire canvas?', () => {
            this.ctx.fillStyle = '#ffffff';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            this.saveState();
        });
    },
    
    saveImage() {
        const link = document.createElement('a');
        link.download = 'zenos-painting.png';
        link.href = this.canvas.toDataURL();
        link.click();
        Toast.show('Image Saved', 'Your painting has been downloaded.', 'success');
    },
    
    floodFill(startX, startY, fillColor) {
        const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
        const data = imageData.data;
        const width = this.canvas.width;
        const height = this.canvas.height;
        
        const startIdx = (startY * width + startX) * 4;
        const startR = data[startIdx], startG = data[startIdx + 1], startB = data[startIdx + 2];
        
        const fill = this.hexToRgb(fillColor);
        if (startR === fill.r && startG === fill.g && startB === fill.b) return;
        
        const stack = [[startX, startY]];
        const visited = new Set();
        
        while (stack.length > 0) {
            const [x, y] = stack.pop();
            const key = `${x},${y}`;
            if (visited.has(key)) continue;
            if (x < 0 || x >= width || y < 0 || y >= height) continue;
            
            const idx = (y * width + x) * 4;
            if (Math.abs(data[idx] - startR) > 30 || Math.abs(data[idx + 1] - startG) > 30 || Math.abs(data[idx + 2] - startB) > 30) continue;
            
            visited.add(key);
            data[idx] = fill.r;
            data[idx + 1] = fill.g;
            data[idx + 2] = fill.b;
            data[idx + 3] = 255;
            
            stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        
        this.ctx.putImageData(imageData, 0, 0);
    },
    
    hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : { r: 0, g: 0, b: 0 };
    }
};

                        this.historyIndex = this.history.length;
                    }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (this.historyIndex > 0) {
                        this.historyIndex--;
                        input.value = this.history[this.historyIndex];
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (this.historyIndex < this.history.length - 1) {
                        this.historyIndex++;
                        input.value = this.history[this.historyIndex];
                    } else {
                        this.historyIndex = this.history.length;
                        input.value = '';
                    }
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    this.tabComplete(input);
                } else if (e.key === 'l' && e.ctrlKey) {
                    e.preventDefault();
                    this.clearOutput();
                }
            });
            
            // Focus input when clicking terminal
            document.querySelector('.terminal').addEventListener('click', () => {
                input.focus();
            });
        }
        
        this.updatePrompt();
    },
    
    updatePrompt() {
        const promptEl = document.getElementById('terminal-prompt');
        if (promptEl) {
            const dir = this.currentDir === this.env.HOME ? '~' : this.currentDir;
            promptEl.textContent = `${this.env.USER}@${this.env.HOSTNAME}:${dir}$`;
        }
    },
    
    executeCommand(cmdLine) {
        const output = document.getElementById('terminal-output');
        if (!output) return;
        
        // Show the command
        const promptText = document.getElementById('terminal-prompt').textContent;
        this.addLine(`${promptText} ${cmdLine}`, 'command');
        
        if (!cmdLine) return;
        
        const parts = cmdLine.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);
        
        // Handle pipes (simplified)
        if (cmdLine.includes('|')) {
            this.addLine('Pipes are simulated simply.', 'info');
        }
        
        if (this.commands[cmd]) {
            const result = typeof this.commands[cmd] === 'function' 
                ? this.commands[cmd](args) 
                : this.commands[cmd];
            if (result !== null && result !== undefined) {
                this.addLine(result);
            }
        } else {
            this.addLine(`zenbash: command not found: ${cmd}`, 'error');
        }
        
        this.updatePrompt();
    },
    
    addLine(text, className = '') {
        const output = document.getElementById('terminal-output');
        if (!output) return;
        
        const line = document.createElement('div');
        line.className = `terminal-line ${className}`;
        line.textContent = text;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
    },
    
    clearOutput() {
        const output = document.getElementById('terminal-output');
        if (output) output.innerHTML = '';
    },
    
    tabComplete(input) {
        const cmd = input.value.trim();
        const commands = Object.keys(this.commands);
        const matches = commands.filter(c => c.startsWith(cmd));
        if (matches.length === 1) {
            input.value = matches[0] + ' ';
        } else if (matches.length > 1) {
            this.addLine(matches.join('  '));
        }
    },
    
    matrixInterval: null,
    
    startMatrix() {
        if (this.matrixInterval) return;
        const output = document.getElementById('terminal-output');
        if (!output) return;
        
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*';
        this.matrixInterval = setInterval(() => {
            let line = '';
            for (let i = 0; i < 60; i++) {
                line += chars[Math.floor(Math.random() * chars.length)];
            }
            const el = document.createElement('div');
            el.className = 'terminal-line info';
            el.textContent = line;
            output.appendChild(el);
            output.scrollTop = output.scrollHeight;
            
            // Limit lines
            while (output.children.length > 100) {
                output.removeChild(output.firstChild);
            }
        }, 100);
        
        // Stop on click
        output.addEventListener('click', () => {
            if (this.matrixInterval) {
                clearInterval(this.matrixInterval);
                this.matrixInterval = null;
            }
        }, { once: true });
    }
};

Apps.Clock = {

    timerInterval: null,
    timerTime: 0,
    
    getHTML() {

                <div class="clock-content">
                    <div class="clock-section active" id="clock-section-clock">
                        <div class="clock-analog" id="clock-analog">
                            <div class="clock-analog-face" id="clock-face"></div>
                            <div class="clock-analog-center"></div>
                            <div class="clock-analog-hand hour" id="clock-hour"></div>
                            <div class="clock-analog-hand minute" id="clock-minute"></div>
                            <div class="clock-analog-hand second" id="clock-second"></div>
                        </div>
                        <div class="clock-digital" id="clock-digital">00:00:00</div>

                    </div>
                    <div class="clock-section" id="clock-section-stopwatch">
                        <div class="stopwatch-display" id="stopwatch-display">00:00:00.00</div>
                        <div class="stopwatch-controls">
                            <button class="stopwatch-btn start" id="stopwatch-start-btn" onclick="Apps.Clock.toggleStopwatch()">Start</button>
                            <button class="stopwatch-btn reset" onclick="Apps.Clock.lapStopwatch()">Lap</button>
                            <button class="stopwatch-btn reset" onclick="Apps.Clock.resetStopwatch()">Reset</button>
                        </div>
                        <div class="stopwatch-laps" id="stopwatch-laps"></div>
                    </div>
                    <div class="clock-section" id="clock-section-timer">
                        <div class="timer-input" id="timer-input-area">
                            <div class="timer-input-field">
                                <input type="number" id="timer-hours" min="0" max="23" value="0" placeholder="00">
                                <label>Hours</label>
                            </div>
                            <div class="timer-input-field">
                                <input type="number" id="timer-minutes" min="0" max="59" value="5" placeholder="00">
                                <label>Minutes</label>
                            </div>
                            <div class="timer-input-field">
                                <input type="number" id="timer-seconds" min="0" max="59" value="0" placeholder="00">
                                <label>Seconds</label>
                            </div>
                        </div>
                        <div class="timer-display" id="timer-display" style="display: none;">00:05:00</div>
                        <div class="stopwatch-controls">
                            <button class="stopwatch-btn start" id="timer-start-btn" onclick="Apps.Clock.toggleTimer()">Start</button>
                            <button class="stopwatch-btn reset" onclick="Apps.Clock.resetTimer()">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        this.renderClockFace();
        this.updateClock();
        this.clockInterval = setInterval(() => this.updateClock(), 1000);
    },
    
    switchTab(tab) {
        this.activeTab = tab;
        document.querySelectorAll('.clock-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.tab === tab);
        });
        document.querySelectorAll('.clock-section').forEach(s => {
            s.classList.remove('active');
        });
        document.getElementById(`clock-section-${tab}`).classList.add('active');
    },
    
    renderClockFace() {
        const face = document.getElementById('clock-face');
        if (!face) return;
        
        for (let i = 0; i < 12; i++) {
            const marker = document.createElement('div');
            marker.className = `clock-analog-marker ${i % 3 === 0 ? 'major' : ''}`;
            marker.style.transform = `rotate(${i * 30}deg)`;
            face.appendChild(marker);
        }
    },
    
    updateClock() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        
        // Analog clock
        const hourDeg = ((hours % 12) + minutes / 60) * 30;
        const minuteDeg = (minutes + seconds / 60) * 6;
        const secondDeg = seconds * 6;
        
        const hourHand = document.getElementById('clock-hour');
        const minuteHand = document.getElementById('clock-minute');
        const secondHand = document.getElementById('clock-second');
        
        if (hourHand) hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
        if (minuteHand) minuteHand.style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
        if (secondHand) secondHand.style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
        
        // Digital clock
        const digital = document.getElementById('clock-digital');
        if (digital) {
            digital.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        // Date
        const dateDisplay = document.getElementById('clock-date-display');
        if (dateDisplay) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            dateDisplay.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
        }
    },
    
    toggleStopwatch() {
        const btn = document.getElementById('stopwatch-start-btn');
        if (this.stopwatchRunning) {
            clearInterval(this.stopwatchInterval);
            this.stopwatchRunning = false;
            btn.textContent = 'Start';
            btn.className = 'stopwatch-btn start';
        } else {
            const startTime = Date.now() - this.stopwatchTime;
            this.stopwatchInterval = setInterval(() => {
                this.stopwatchTime = Date.now() - startTime;
                this.updateStopwatchDisplay();
            }, 10);
            this.stopwatchRunning = true;
            btn.textContent = 'Stop';
            btn.className = 'stopwatch-btn stop';
        }
    },
    
    updateStopwatchDisplay() {
        const display = document.getElementById('stopwatch-display');
        if (!display) return;
        
        const ms = Math.floor(this.stopwatchTime % 1000 / 10);
        const s = Math.floor(this.stopwatchTime / 1000) % 60;
        const m = Math.floor(this.stopwatchTime / 60000) % 60;
        const h = Math.floor(this.stopwatchTime / 3600000);
        
        display.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    },
    
    lapStopwatch() {
        if (!this.stopwatchRunning) return;
        this.stopwatchLaps.push(this.stopwatchTime);
        const container = document.getElementById('stopwatch-laps');
        if (container) {
            const lap = this.stopwatchLaps.length;
            const time = document.getElementById('stopwatch-display').textContent;
            container.innerHTML = `<div class="stopwatch-lap"><span>Lap ${lap}</span><span>${time}</span></div>` + container.innerHTML;
        }
    },
    
    resetStopwatch() {
        clearInterval(this.stopwatchInterval);
        this.stopwatchRunning = false;
        this.stopwatchTime = 0;
        this.stopwatchLaps = [];
        this.updateStopwatchDisplay();
        document.getElementById('stopwatch-start-btn').textContent = 'Start';
        document.getElementById('stopwatch-start-btn').className = 'stopwatch-btn start';
        const container = document.getElementById('stopwatch-laps');
        if (container) container.innerHTML = '';
    },
    
    toggleTimer() {
        const btn = document.getElementById('timer-start-btn');
        if (this.timerInterval) {
            clearInterval(this.timerInterval);
            this.timerInterval = null;
            btn.textContent = 'Start';
            btn.className = 'stopwatch-btn start';
        } else {
            if (this.timerTime <= 0) {
                const h = parseInt(document.getElementById('timer-hours').value) || 0;
                const m = parseInt(document.getElementById('timer-minutes').value) || 0;
                const s = parseInt(document.getElementById('timer-seconds').value) || 0;
                this.timerTime = (h * 3600 + m * 60 + s) * 1000;
            }
            if (this.timerTime <= 0) {
                Toast.show('Timer', 'Please set a time first.', 'warning');
                return;
            }
            
            document.getElementById('timer-input-area').style.display = 'none';
            document.getElementById('timer-display').style.display = '';
            
            const endTime = Date.now() + this.timerTime;
            this.timerInterval = setInterval(() => {
                this.timerTime = endTime - Date.now();
                if (this.timerTime <= 0) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                    this.timerTime = 0;
                    btn.textContent = 'Start';
                    btn.className = 'stopwatch-btn start';
                    Toast.show('Timer', 'Time is up!', 'success');
                    document.getElementById('timer-display').textContent = '00:00:00';
                    return;
                }
                this.updateTimerDisplay();
            }, 1000);
            btn.textContent = 'Pause';
            btn.className = 'stopwatch-btn stop';
        }
    },
    
    updateTimerDisplay() {
        const display = document.getElementById('timer-display');
        if (!display) return;
        const total = Math.ceil(this.timerTime / 1000);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        display.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    },
    
    resetTimer() {
        clearInterval(this.timerInterval);
        this.timerInterval = null;
        this.timerTime = 0;
        document.getElementById('timer-input-area').style.display = '';
        document.getElementById('timer-display').style.display = 'none';
        document.getElementById('timer-start-btn').textContent = 'Start';
        document.getElementById('timer-start-btn').className = 'stopwatch-btn start';
    }
};

    currentDate: new Date(),
    selectedDate: new Date(),
    viewMonth: new Date(),
    events: [
        { date: new Date().toISOString().split('T')[0], time: '09:00', title: 'Team Meeting', color: '#4fc3f7' },
        { date: new Date().toISOString().split('T')[0], time: '14:00', title: 'Project Review', color: '#28c940' },
        { date: new Date(Date.now() + 86400000).toISOString().split('T')[0], time: '10:00', title: 'Dentist Appointment', color: '#ff5f57' },
        { date: new Date(Date.now() + 172800000).toISOString().split('T')[0], time: '18:00', title: 'Dinner with Friends', color: '#ffbd2e' }
    ],
    
    getHTML() {
        return `
            <div class="calendar-app">
                <div class="calendar-header">
                    <div class="calendar-title" id="calendar-title">May 2026</div>
                    <div class="calendar-nav">
                        <div class="calendar-nav-btn" onclick="Apps.Calendar.prevMonth()">←</div>
                        <div class="calendar-nav-btn" onclick="Apps.Calendar.nextMonth()">→</div>
                    </div>
                    <div class="calendar-today-btn" onclick="Apps.Calendar.goToToday()">Today</div>
                    <div class="calendar-add-event-btn" onclick="Apps.Calendar.addEvent()">+</div>
                </div>
                <div class="calendar-body">
                    <div class="calendar-sidebar">
                        <div class="mini-calendar" id="mini-calendar"></div>
                        <div class="calendar-events-list">
                            <div class="calendar-events-title">Upcoming Events</div>
                            <div id="calendar-events-list"></div>
                        </div>
                    </div>
                    <div class="calendar-main">
                        <div class="calendar-weekdays">
                            <div class="calendar-weekday">Sun</div>
                            <div class="calendar-weekday">Mon</div>
                            <div class="calendar-weekday">Tue</div>
                            <div class="calendar-weekday">Wed</div>
                            <div class="calendar-weekday">Thu</div>
                            <div class="calendar-weekday">Fri</div>
                            <div class="calendar-weekday">Sat</div>
                        </div>
                        <div class="calendar-days" id="calendar-days"></div>
                    </div>
                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        this.render();
    },
    
    render() {
        this.renderMainCalendar();
        this.renderMiniCalendar();
        this.renderEvents();
        this.updateTitle();
    },
    
    updateTitle() {
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const el = document.getElementById('calendar-title');
        if (el) el.textContent = `${months[this.viewMonth.getMonth()]} ${this.viewMonth.getFullYear()}`;
    },
    
    renderMainCalendar() {
        const container = document.getElementById('calendar-days');
        if (!container) return;
        
        const year = this.viewMonth.getFullYear();
        const month = this.viewMonth.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();
        
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        const selectedStr = this.selectedDate.toISOString().split('T')[0];
        
        let html = '';
        
        // Previous month days
        for (let i = firstDay - 1; i >= 0; i--) {
            const day = daysInPrevMonth - i;
            html += `<div class="calendar-day other-month"><div class="calendar-day-number">${day}</div></div>`;
        }
        
        // Current month days
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const isToday = dateStr === todayStr;
            const isSelected = dateStr === selectedStr;
            const dayEvents = this.events.filter(e => e.date === dateStr);
            
            html += `<div class="calendar-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="Apps.Calendar.selectDate('${dateStr}')">
                <div class="calendar-day-number">${day}</div>
                <div class="calendar-day-events">
                    ${dayEvents.slice(0, 2).map(e => `<div class="calendar-day-event" style="border-left: 3px solid ${e.color};">${e.title}</div>`).join('')}
                    ${dayEvents.length > 2 ? `<div class="calendar-day-event">+${dayEvents.length - 2} more</div>` : ''}
                </div>
            </div>`;
        }
        
        // Next month days
        const totalCells = firstDay + daysInMonth;
        const remaining = 42 - totalCells;
        for (let day = 1; day <= remaining && totalCells + day <= 42; day++) {
            html += `<div class="calendar-day other-month"><div class="calendar-day-number">${day}</div></div>`;
        }
        
        container.innerHTML = html;
    },
    
    renderMiniCalendar() {
        const container = document.getElementById('mini-calendar');
        if (!container) return;
        
        const year = this.viewMonth.getFullYear();
        const month = this.viewMonth.getMonth();
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        
        let html = `
            <div class="mini-calendar-header">
                <div class="mini-calendar-title">${months[month]} ${year}</div>
                <div class="mini-calendar-nav">
                    <div class="mini-calendar-nav-btn" onclick="Apps.Calendar.prevMonth()">◀</div>
                    <div class="mini-calendar-nav-btn" onclick="Apps.Calendar.nextMonth()">▶</div>
                </div>
            </div>
            <div class="mini-calendar-grid">
                ${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="mini-calendar-day-name">${d}</div>`).join('')}
        `;
        
        for (let i = 0; i < firstDay; i++) {
            html += `<div class="mini-calendar-day"></div>`;
        }
        
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const isToday = dateStr === todayStr;
            const hasEvent = this.events.some(e => e.date === dateStr);
            html += `<div class="mini-calendar-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}" onclick="Apps.Calendar.selectDate('${dateStr}')">${day}</div>`;
        }
        
        html += '</div>';
        container.innerHTML = html;
    },
    
    renderEvents() {
        const container = document.getElementById('calendar-events-list');
        if (!container) return;
        
        const upcoming = this.events
            .filter(e => new Date(e.date) >= new Date(new Date().toISOString().split('T')[0]))
            .sort((a, b) => new Date(a.date) - new Date(b.date) || a.time.localeCompare(b.time))
            .slice(0, 5);
        
        if (upcoming.length === 0) {
            container.innerHTML = '<div style="color: rgba(255,255,255,0.4); font-size: 12px; padding: 10px;">No upcoming events</div>';
            return;
        }
        
        container.innerHTML = upcoming.map(e => {
            const date = new Date(e.date);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `
                <div class="calendar-event-item" style="border-left-color: ${e.color};">
                    <div class="calendar-event-time">${months[date.getMonth()]} ${date.getDate()} · ${e.time}</div>
                    <div class="calendar-event-title">${e.title}</div>
                </div>
            `;
        }).join('');
    },
    
    prevMonth() {
        this.viewMonth.setMonth(this.viewMonth.getMonth() - 1);
        this.render();
    },
    
    nextMonth() {
        this.viewMonth.setMonth(this.viewMonth.getMonth() + 1);
        this.render();
    },
    
    goToToday() {
        this.viewMonth = new Date();
        this.selectedDate = new Date();
        this.render();
    },
    
    selectDate(dateStr) {
        this.selectedDate = new Date(dateStr);
        this.render();
    },
    
    addEvent() {
        Dialog.prompt('New Event', 'Enter event title:', '', (title) => {
            if (title) {
                Dialog.prompt('Event Time', 'Enter time (HH:MM):', '09:00', (time) => {
                    const dateStr = this.selectedDate.toISOString().split('T')[0];
                    const colors = ['#4fc3f7', '#28c940', '#ff5f57', '#ffbd2e', '#764ba2', '#f5af19'];
                    this.events.push({
                        date: dateStr,
                        time: time,
                        title: title,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                    this.render();
                    Toast.show('Event Added', `"${title}" has been added to your calendar.`, 'success');
                });
            }
        });
    }
};

                            <div class="music-player-control-btn" onclick="Apps.MusicPlayer.toggleRepeat()">🔁</div>
                        </div>
                        <div class="music-player-volume">
                            <div class="music-player-volume-icon" onclick="Apps.MusicPlayer.toggleMute()">🔊</div>
                            <input type="range" class="music-player-volume-slider" min="0" max="100" value="75" oninput="Apps.MusicPlayer.setVolume(this.value)">
                        </div>
                    </div>
                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        this.renderTrackList();
        this.loadTrack(0);
    },
    
    renderTrackList(filter = '') {
        const container = document.getElementById('music-track-list');
        if (!container) return;
        
        const tracks = this.tracks.filter(t => 
            !filter || t.title.toLowerCase().includes(filter.toLowerCase()) || 
            t.artist.toLowerCase().includes(filter.toLowerCase())
        );
        
        container.innerHTML = `
            <div class="music-player-library-title">All Tracks (${tracks.length})</div>
            ${tracks.map((track, i) => `
                <div class="music-player-track ${this.tracks.indexOf(track) === this.currentTrack ? 'playing' : ''}" onclick="Apps.MusicPlayer.loadTrack(${this.tracks.indexOf(track)}); Apps.MusicPlayer.play();">
                    <div class="music-player-track-art" style="background: linear-gradient(135deg, ${track.color}, ${track.color}88);">🎵</div>
                    <div class="music-player-track-info">
                        <div class="music-player-track-title">${track.title}</div>
                        <div class="music-player-track-artist">${track.artist}</div>
                    </div>
                    <div class="music-player-track-duration">${track.duration}</div>
                </div>
            `).join('')}
        `;
    },
    
    filterTracks(query) {
        this.renderTrackList(query);
    },
    
    loadTrack(index) {
        this.currentTrack = index;
        const track = this.tracks[index];
        
        const title = document.getElementById('music-title');
        const artist = document.getElementById('music-artist');
        const art = document.getElementById('music-album-art');
        const duration = document.getElementById('music-duration');
        
        if (title) title.textContent = track.title;
        if (artist) artist.textContent = track.artist;
        if (art) {
            art.style.background = `linear-gradient(135deg, ${track.color}, ${track.color}88)`;
        }
        if (duration) duration.textContent = track.duration;
        
        this.currentTime = 0;
        this.updateProgress();
        this.renderTrackList();
    },
    
    togglePlay() {
        if (this.isPlaying) {
            this.pause();
        } else {
            this.play();
        }
    },
    
    play() {
        this.isPlaying = true;
        document.getElementById('music-play-btn').textContent = '⏸';
        document.getElementById('music-album-art').classList.add('playing');
        
        this.interval = setInterval(() => {
            this.currentTime++;
            if (this.currentTime >= this.tracks[this.currentTrack].durationSec) {
                this.nextTrack();
            }
            this.updateProgress();
        }, 1000);
    },
    
    pause() {
        this.isPlaying = false;
        document.getElementById('music-play-btn').textContent = '▶';
        document.getElementById('music-album-art').classList.remove('playing');
        clearInterval(this.interval);
    },
    
    nextTrack() {
        this.currentTrack = (this.currentTrack + 1) % this.tracks.length;
        this.loadTrack(this.currentTrack);
        if (this.isPlaying) {
            clearInterval(this.interval);
            this.play();
        }
    },
    
    prevTrack() {
        if (this.currentTime > 3) {
            this.currentTime = 0;
            this.updateProgress();
        } else {
            this.currentTrack = (this.currentTrack - 1 + this.tracks.length) % this.tracks.length;
            this.loadTrack(this.currentTrack);
            if (this.isPlaying) {
                clearInterval(this.interval);
                this.play();
            }
        }
    },
    
    updateProgress() {
        const track = this.tracks[this.currentTrack];
        const percent = (this.currentTime / track.durationSec) * 100;
        
        const fill = document.getElementById('music-progress-fill');
        const currentTimeEl = document.getElementById('music-current-time');
        
        if (fill) fill.style.width = percent + '%';
        if (currentTimeEl) {
            const mins = Math.floor(this.currentTime / 60);
            const secs = this.currentTime % 60;
            currentTimeEl.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
        }
    },
    
    seek(e) {
        const bar = document.getElementById('music-progress-bar');
        const rect = bar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        const track = this.tracks[this.currentTrack];
        this.currentTime = Math.floor(percent * track.durationSec);
        this.updateProgress();
    },
    
    setVolume(value) {
        this.volume = parseInt(value);
    },
    
    toggleMute() {
        this.volume = this.volume > 0 ? 0 : 75;
        document.querySelector('.music-player-volume-slider').value = this.volume;
    },
    
    shuffle() {
        this.currentTrack = Math.floor(Math.random() * this.tracks.length);
        this.loadTrack(this.currentTrack);
        Toast.show('Music', 'Shuffle mode enabled', 'info');
    },
    
    toggleRepeat() {
        Toast.show('Music', 'Repeat mode toggled', 'info');
    }
};

            .filter(n => !filter || n.title.toLowerCase().includes(filter.toLowerCase()) || n.content.toLowerCase().includes(filter.toLowerCase()))

        `).join('');

        this.activeNoteId = id;
        const note = this.notes.find(n => n.id === id);

        if (!main) return;

        `;
        
        this.renderNotesList();
    },
    
    createNew() {
        const note = {
            id: this.nextId++,
            title: '',
            content: '',
            created: Date.now(),
            modified: Date.now()
        };
        this.notes.unshift(note);
        this.saveNotes();
        this.selectNote(note.id);
    },
    
    updateTitle(title) {
        const note = this.notes.find(n => n.id === this.activeNoteId);
        if (note) {
            note.title = title;
            note.modified = Date.now();
            this.saveNotes();
            this.renderNotesList();
        }
    },
    
    updateContent(content) {
        const note = this.notes.find(n => n.id === this.activeNoteId);
        if (note) {
            note.content = content;
            note.modified = Date.now();
            this.saveNotes();
            this.renderNotesList();
        }
    },
    
    filterNotes(query) {
        this.renderNotesList(query);
    },
    
    saveNotes() {
        localStorage.setItem('zenos-notes', JSON.stringify(this.notes));
    },
    
    formatDate(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return 'Just now';
        if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
        if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
        if (diff < 604800000) return `${Math.floor(diff / 86400000)}d ago`;
        return date.toLocaleDateString();
    }
};

Apps.Minesweeper = {

    difficulties: {
        easy: { rows: 8, cols: 8, mines: 10 },

    },
    board: [],
    revealed: [],
    flagged: [],
    gameOver: false,
    firstClick: true,
    minesLeft: 0,
    timer: 0,
    timerInterval: null,
    face: '😊',
    
    getHTML() {
        return `
            <div class="minesweeper">
                <div class="minesweeper-header">
                    <div class="minesweeper-stats">

                        <div class="minesweeper-difficulty-btn" onclick="Apps.Minesweeper.setDifficulty('hard')">Hard</div>
                    </div>
                </div>
                <div class="minesweeper-board-container">
                    <div class="minesweeper-board" id="ms-board"></div>
                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        this.newGame();
    },
    
    setDifficulty(diff) {
        this.difficulty = diff;
        document.querySelectorAll('.minesweeper-difficulty-btn').forEach((btn, i) => {
            btn.classList.toggle('active', ['easy', 'medium', 'hard'][i] === diff);
        });
        this.newGame();
    },
    
    newGame() {
        const { rows, cols, mines } = this.difficulties[this.difficulty];
        this.rows = rows;
        this.cols = cols;
        this.totalMines = mines;
        this.minesLeft = mines;
        this.board = [];
        this.revealed = [];
        this.flagged = [];
        this.gameOver = false;
        this.firstClick = true;
        this.timer = 0;
        this.face = '😊';
        
        clearInterval(this.timerInterval);
        
        // Initialize arrays
        for (let r = 0; r < rows; r++) {
            this.board[r] = [];
            this.revealed[r] = [];
            this.flagged[r] = [];
            for (let c = 0; c < cols; c++) {
                this.board[r][c] = 0;
                this.revealed[r][c] = false;
                this.flagged[r][c] = false;
            }
        }
        
        this.updateDisplay();
        this.renderBoard();
    },
    
    placeMines(excludeR, excludeC) {
        let placed = 0;
        while (placed < this.totalMines) {
            const r = Math.floor(Math.random() * this.rows);
            const c = Math.floor(Math.random() * this.cols);
            if (this.board[r][c] !== 'M' && !(r === excludeR && c === excludeC)) {
                this.board[r][c] = 'M';
                placed++;
            }
        }
        
        // Calculate numbers
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                if (this.board[r][c] === 'M') continue;
                let count = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols && this.board[nr][nc] === 'M') {
                            count++;
                        }
                    }
                }
                this.board[r][c] = count;
            }
        }
    },
    
    renderBoard() {
        const board = document.getElementById('ms-board');
        if (!board) return;
        
        board.style.gridTemplateColumns = `repeat(${this.cols}, 30px)`;
        board.innerHTML = '';
        
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'minesweeper-cell';
                cell.dataset.r = r;
                cell.dataset.c = c;
                
                if (this.revealed[r][c]) {
                    cell.classList.add('revealed');
                    if (this.board[r][c] === 'M') {
                        cell.classList.add('mine');
                        cell.textContent = '💣';
                    } else if (this.board[r][c] > 0) {
                        cell.textContent = this.board[r][c];
                        cell.dataset.number = this.board[r][c];
                    }
                } else if (this.flagged[r][c]) {
                    cell.classList.add('flagged');
                    cell.textContent = '🚩';
                }
                
                cell.addEventListener('click', () => this.handleClick(r, c));
                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    this.handleRightClick(r, c);
                });
                
                board.appendChild(cell);
            }
        }
    },
    
    handleClick(r, c) {
        if (this.gameOver || this.flagged[r][c] || this.revealed[r][c]) return;
        
        if (this.firstClick) {
            this.firstClick = false;
            this.placeMines(r, c);
            this.timerInterval = setInterval(() => {
                this.timer++;
                this.updateTimerDisplay();
            }, 1000);
        }
        
        if (this.board[r][c] === 'M') {
            this.gameOverLose(r, c);
            return;
        }
        
        this.reveal(r, c);
        this.renderBoard();
        this.checkWin();
    },
    
    handleRightClick(r, c) {
        if (this.gameOver || this.revealed[r][c]) return;
        
        this.flagged[r][c] = !this.flagged[r][c];
        this.minesLeft += this.flagged[r][c] ? -1 : 1;
        this.updateDisplay();
        this.renderBoard();
    },
    
    reveal(r, c) {
        if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return;
        if (this.revealed[r][c] || this.flagged[r][c]) return;
        
        this.revealed[r][c] = true;
        
        if (this.board[r][c] === 0) {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    this.reveal(r + dr, c + dc);
                }
            }
        }
    },
    
    gameOverLose(r, c) {
        this.gameOver = true;
        this.face = '😵';
        clearInterval(this.timerInterval);
        
        // Reveal all mines
        for (let i = 0; i < this.rows; i++) {
            for (let j = 0; j < this.cols; j++) {
                if (this.board[i][j] === 'M') {
                    this.revealed[i][j] = true;
                }
            }
        }
        
        this.renderBoard();
        this.updateDisplay();
        Toast.show('Minesweeper', 'Game Over! You hit a mine.', 'error');
    },
    
    checkWin() {
        let unrevealedSafe = 0;
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                if (!this.revealed[r][c] && this.board[r][c] !== 'M') {
                    unrevealedSafe++;
                }
            }
        }
        
        if (unrevealedSafe === 0) {
            this.gameOver = true;
            this.face = '😎';
            clearInterval(this.timerInterval);
            Toast.show('Minesweeper', `You won in ${this.timer} seconds!`, 'success');
            this.updateDisplay();
        }
    },
    
    updateDisplay() {
        const minesEl = document.getElementById('ms-mines');
        const timerEl = document.getElementById('ms-timer');
        const faceEl = document.getElementById('ms-face');
        
        if (minesEl) minesEl.textContent = `💣 ${String(this.minesLeft).padStart(3, '0')}`;
        if (faceEl) faceEl.textContent = this.face;
    },
    
    updateTimerDisplay() {
        const timerEl = document.getElementById('ms-timer');
        if (timerEl) timerEl.textContent = `⏱ ${String(Math.min(this.timer, 999)).padStart(3, '0')}`;
    }
};

    food: null,
    direction: 'right',
    nextDirection: 'right',
    score: 0,
    highScore: 0,
    running: false,
    gameOver: false,
    speed: 120,
    interval: null,
    
    getHTML() {
        return `
            <div class="snake-app">

                    <div class="snake-dpad">
