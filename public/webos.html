/* ========================================================================

/* ========================================================================
   CSS RESET AND BASE STYLES
   ======================================================================== */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

body {
    background: #000;
    color: #fff;
    font-size: 14px;
    line-height: 1.5;
}

/* ========================================================================
   BOOT SCREEN
   ======================================================================== */
#boot-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100000;
    transition: opacity 1s ease;
}

#boot-screen.hidden {
    opacity: 0;
    pointer-events: none;
}

.boot-logo {
    width: 150px;
    height: 150px;
    margin-bottom: 50px;
    position: relative;
    animation: bootPulse 2s ease-in-out infinite;
}

.boot-logo-inner {
    width: 100%;
    height: 100%;
    border: 4px solid #4fc3f7;
    border-radius: 50%;
    position: relative;
    animation: bootRotate 3s linear infinite;
}

.boot-logo-inner::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60%;
    height: 60%;
    border: 3px solid #81d4fa;
    border-radius: 50%;
    animation: bootRotateReverse 2s linear infinite;
}

.boot-logo-inner::after {
    content: 'Z';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: bold;
    color: #4fc3f7;
    text-shadow: 0 0 20px #4fc3f7;
}

@keyframes bootPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes bootRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes bootRotateReverse {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
}

.boot-text {
    color: #4fc3f7;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 30px;
    text-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
}

.boot-progress-container {
    width: 300px;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 20px;
}

.boot-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #4fc3f7, #81d4fa);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px #4fc3f7;
}

.boot-status {
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    letter-spacing: 1px;
}

.boot-dots {
    display: flex;
    gap: 8px;
    margin-top: 30px;
}

.boot-dot {
    width: 8px;
    height: 8px;
    background: #4fc3f7;
    border-radius: 50%;
    animation: bootDotPulse 1.5s ease-in-out infinite;
}

.boot-dot:nth-child(2) { animation-delay: 0.2s; }
.boot-dot:nth-child(3) { animation-delay: 0.4s; }
.boot-dot:nth-child(4) { animation-delay: 0.6s; }
.boot-dot:nth-child(5) { animation-delay: 0.8s; }

@keyframes bootDotPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
}

/* ========================================================================
   LOGIN SCREEN
   ======================================================================== */

}

.taskbar-tray-icon {

.taskbar-tray-icon:hover {

.taskbar-clock {

.taskbar-clock-time {

.taskbar-clock-date {

/* ========================================================================
   WINDOWS
   ======================================================================== */
.window {
    position: absolute;
    background: rgba(30, 30, 40, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    min-width: 300px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow 0.2s ease;
}

.window.focused {
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
    border-color: rgba(79, 195, 247, 0.3);
}

.window.maximized {
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: calc(100vh - 48px) !important;
    border-radius: 0;
    border: none;
}

.window.minimized {
    display: none;
}

.window-opening {
    animation: windowOpen 0.3s ease;
}

@keyframes windowOpen {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.window-closing {
    animation: windowClose 0.2s ease forwards;
}

@keyframes windowClose {
    to {
        opacity: 0;
        transform: scale(0.9);
    }
}

/* Window Resize Handles */
.window-resize-handle {

}

.window-resize-n {
    top: -3px;
    left: 10px;
    right: 10px;
    height: 6px;
    cursor: n-resize;
}

.window-resize-s {
    bottom: -3px;
    left: 10px;
    right: 10px;
    height: 6px;
    cursor: s-resize;
}

.window-resize-e {
    right: -3px;
    top: 10px;
    bottom: 10px;
    width: 6px;
    cursor: e-resize;
}

.window-resize-w {
    left: -3px;
    top: 10px;
    bottom: 10px;
    width: 6px;
    cursor: w-resize;
}

.window-resize-ne {
    top: -3px;
    right: -3px;
    width: 12px;
    height: 12px;
    cursor: ne-resize;
}

.window-resize-nw {
    top: -3px;
    left: -3px;
    width: 12px;
    height: 12px;
    cursor: nw-resize;
}

.window-resize-se {
    bottom: -3px;
    right: -3px;
    width: 12px;
    height: 12px;
    cursor: se-resize;
}

.window-resize-sw {
    bottom: -3px;
    left: -3px;
    width: 12px;

}

/* ========================================================================
   CLOCK APP
   ======================================================================== */
.clock-app {
    display: flex;

}

}

}

}

.clock-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.clock-section {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.clock-section.active {
    display: flex;
}

.clock-analog {
    width: 280px;
    height: 280px;
    border: 4px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    position: relative;
    margin-bottom: 30px;
}

.clock-analog-face {
    width: 100%;
    height: 100%;
    position: relative;
}

.clock-analog-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    background: #4fc3f7;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
}

.clock-analog-hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    background: #fff;
    border-radius: 2px;
}

.clock-analog-hand.hour {
    width: 4px;
    height: 70px;
    margin-left: -2px;
}

.clock-analog-hand.minute {
    width: 3px;
    height: 95px;
    margin-left: -1.5px;
    background: #4fc3f7;
}

.clock-analog-hand.second {
    width: 1px;
    height: 105px;
    margin-left: -0.5px;
    background: #ff6b6b;
}

.clock-analog-marker {
    position: absolute;
    width: 2px;
    height: 10px;
    background: rgba(255, 255, 255, 0.5);
    top: 10px;
    left: 50%;
    margin-left: -1px;
    transform-origin: center 130px;
}

.clock-analog-marker.major {
    height: 15px;
    width: 3px;
    background: #fff;
}

.clock-digital {
    font-size: 72px;
    font-weight: 200;
    color: #fff;
    text-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
    letter-spacing: 2px;
}

.clock-digital-seconds {
    font-size: 24px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 5px;
}

.clock-digital-date {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.6);
    margin-top: 15px;
}

.stopwatch-display {

    font-weight: 200;
    color: #fff;

    font-family: 'Consolas', monospace;
}

.stopwatch-controls {
    display: flex;

}

    border-radius: 25px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.stopwatch-btn.start {
    background: #28c940;
    color: #fff;
}

.stopwatch-btn.stop {
    background: #ff5f57;
    color: #fff;
}

.stopwatch-btn.reset {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}

.stopwatch-btn:hover {
    transform: translateY(-2px);

}

}

    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
}

    display: flex;

}

.music-player-album-art::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.3) 100%);
}

.music-player-album-art.playing {
    animation: albumSpin 20s linear infinite;
}

@keyframes albumSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.music-player-song-info {

}

.music-player-song-title {

.music-player-progress {

.music-player-progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    margin-bottom: 8px;
}

    height: 100%;
    background: #4fc3f7;
    border-radius: 2px;
    position: relative;
    transition: width 0.1s linear;
}

.music-player-progress-fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.music-player-progress-bar:hover .music-player-progress-fill::after {
    opacity: 1;
}

.music-player-progress-time {

    justify-content: space-between;

    font-size: 20px;

/* ========================================================================
   MINESWEEPER APP
   ======================================================================== */
.minesweeper {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: rgba(30, 30, 45, 0.8);
}

.minesweeper-header {
    padding: 15px 20px;
    background: rgba(40, 40, 55, 0.8);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.minesweeper-stats {
    display: flex;
    gap: 20px;
}

.minesweeper-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.3);
    padding: 6px 12px;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 18px;
    color: #ff5f57;
}

.minesweeper-face {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.minesweeper-face:hover {
    background: rgba(255, 255, 255, 0.15);
}

.minesweeper-difficulty {
    display: flex;
    gap: 5px;
}

.minesweeper-difficulty-btn {
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: all 0.2s ease;
}

.minesweeper-difficulty-btn:hover {
    background: rgba(255, 255, 255, 0.12);
}

.minesweeper-difficulty-btn.active {
    background: rgba(79, 195, 247, 0.2);
    color: #4fc3f7;
}

.minesweeper-board-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

.minesweeper-board {
    display: grid;
    gap: 2px;
    background: rgba(255, 255, 255, 0.05);
    padding: 5px;
    border-radius: 4px;
}

.minesweeper-cell {
    width: 30px;
    height: 30px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;

.minesweeper-cell:hover:not(.revealed):not(.flagged) {

.minesweeper-cell.revealed {
    background: rgba(0, 0, 0, 0.2);
    cursor: default;
}

.minesweeper-cell.flagged {
    background: rgba(79, 195, 247, 0.2);
}

.minesweeper-cell.mine {
    background: rgba(255, 95, 87, 0.3);
}

.minesweeper-cell[data-number="1"] { color: #4fc3f7; }
.minesweeper-cell[data-number="2"] { color: #28c940; }
.minesweeper-cell[data-number="3"] { color: #ff5f57; }
.minesweeper-cell[data-number="4"] { color: #764ba2; }
.minesweeper-cell[data-number="5"] { color: #ffbd2e; }
.minesweeper-cell[data-number="6"] { color: #00f2fe; }
.minesweeper-cell[data-number="7"] { color: #fff; }
.minesweeper-cell[data-number="8"] { color: #999; }

.snake-score {

.snake-score-item {

    align-items: center;

.snake-score-label {

    color: rgba(255, 255, 255, 0.5);

.snake-score-value {

.snake-btn {

.snake-btn.pause {

.snake-cell {

.snake-cell.snake-head {

}

.snake-cell.snake-body {

.snake-cell.food {

.snake-overlay-text {

.snake-overlay-score {

.snake-mobile-controls {

.snake-dpad {

.snake-dpad-btn {

.snake-dpad-btn:hover {

.snake-dpad-btn:active {

.snake-dpad-up { grid-column: 2; grid-row: 1; }

    grid-template-columns: repeat(4, 20px);

    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;

    display: grid;
    grid-template-columns: repeat(10, 25px);
    grid-template-rows: repeat(20, 25px);
    gap: 1px;
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    padding: 1px;
}

.tetris-cell {
    background: rgba(255, 255, 255, 0.03);
    border-radius: 2px;
}

.tetris-cell.filled {
    box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.3);
}

.tetris-cell.I { background: #00f2fe; }
.tetris-cell.O { background: #ffbd2e; }
.tetris-cell.T { background: #764ba2; }
.tetris-cell.S { background: #28c940; }
.tetris-cell.Z { background: #ff5f57; }
.tetris-cell.J { background: #4fc3f7; }
.tetris-cell.L { background: #f5af19; }

.tetris-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    border-radius: 4px;
}

.tetris-overlay-text {
    font-size: 32px;
    font-weight: 300;
    color: #fff;
}

.tetris-btn {
    padding: 10px 25px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: #4fc3f7;
    color: #fff;
}

.tetris-btn:hover {
    background: #81d4fa;
    transform: translateY(-2px);
}

.tetris-controls-info {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.3);
}

.calculator-pro-btn.sci:hover {

.calculator-pro-btn.operator {

}

.music-visualizer-type {

}

.music-visualizer-type-btn {

    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    cursor: pointer;

}

.music-visualizer-type-btn.active {
    background: rgba(79, 195, 247, 0.2);

}

.music-visualizer-canvas {

}

.music-visualizer-controls {

.music-visualizer-play-btn {

.music-visualizer-play-btn:hover {

.music-visualizer-track-name {

/* ========================================================================
   SYSTEM MONITOR APP
   ======================================================================== */
.system-monitor {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.system-monitor-header {
    padding: 20px;
    background: rgba(35, 35, 50, 0.6);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.system-monitor-title {
    font-size: 20px;
    font-weight: 400;
    color: #fff;
}

.system-monitor-tabs {
    display: flex;
    gap: 10px;
}

.system-monitor-tab {
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    transition: all 0.2s ease;
}

.system-monitor-tab:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}

.system-monitor-tab.active {
    background: rgba(79, 195, 247, 0.2);
    color: #4fc3f7;
}

.system-monitor-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.system-monitor-section {
    display: none;
}

.system-monitor-section.active {
    display: block;
}

.system-monitor-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.system-monitor-card {
    background: rgba(40, 40, 55, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 20px;
}

.system-monitor-card-title {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.system-monitor-card-value {
    font-size: 36px;
    font-weight: 300;
    color: #4fc3f7;
    margin-bottom: 15px;
}

.system-monitor-chart {
    height: 80px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
}

.system-monitor-chart-line {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.system-monitor-chart svg {
    width: 100%;
    height: 100%;
}

.system-monitor-info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.system-monitor-info-item {
    background: rgba(40, 40, 55, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 15px;
}

.system-monitor-info-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
}

.system-monitor-info-value {
    font-size: 14px;
    color: #e0e0e0;
}

.system-monitor-processes-table {
    width: 100%;
    border-collapse: collapse;
}

.system-monitor-processes-table th {
    text-align: left;
    padding: 10px 15px;
    background: rgba(30, 30, 45, 0.8);
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    position: sticky;
    top: 0;
}

.system-monitor-processes-table td {
    padding: 8px 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 12px;
    color: #e0e0e0;
}

.system-monitor-processes-table tr:hover td {
    background: rgba(255, 255, 255, 0.03);
}

/* ========================================================================
   NOTIFICATION CENTER
   ======================================================================== */
#notification-center {
    position: fixed;
    right: -350px;
    top: 0;
    width: 350px;
    height: calc(100% - 48px);
    background: rgba(25, 25, 35, 0.95);
    backdrop-filter: blur(30px);
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 44000;
    transition: right 0.3s ease;
    display: flex;
    flex-direction: column;
}

#notification-center.visible {
    right: 0;
}

.notification-center-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.notification-center-title {
    font-size: 18px;
    font-weight: 500;
    color: #fff;
}

.notification-center-clear {
    font-size: 12px;
    color: #4fc3f7;
    cursor: pointer;
}

.notification-center-clear:hover {
    color: #81d4fa;
}

.notification-center-quick-actions {
    padding: 15px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.notification-quick-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(255, 255, 255, 0.05);
}

.notification-quick-action:hover {
    background: rgba(255, 255, 255, 0.1);
}

.notification-quick-action.active {
    background: rgba(79, 195, 247, 0.2);
}

.notification-quick-action-icon {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.7);
}

.notification-quick-action.active .notification-quick-action-icon {
    color: #4fc3f7;
}

.notification-quick-action-label {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.5);
}

.notification-list {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.notification-list::-webkit-scrollbar {
    width: 6px;
}

.notification-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
}

.notification-item {
    background: rgba(40, 40, 55, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 12px 15px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.notification-item:hover {
    background: rgba(50, 50, 70, 0.5);
}

.notification-item-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
}

.notification-item-app {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
}

.notification-item-time {
    margin-left: auto;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.3);
}

.notification-item-title {
    font-size: 13px;
    font-weight: 500;
    color: #e0e0e0;
    margin-bottom: 3px;
}

.notification-item-body {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
}

.notification-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: rgba(255, 255, 255, 0.3);
    gap: 10px;
}

.notification-empty-icon {
    font-size: 36px;
}

.notification-empty-text {
    font-size: 14px;
}

/* ========================================================================
   TOAST NOTIFICATIONS
   ======================================================================== */
#toast-container {
    position: fixed;
    bottom: 60px;
    right: 20px;
    z-index: 60000;
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    max-height: 300px;
    overflow: hidden;
}

.toast {
    background: rgba(35, 35, 50, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 280px;
    max-width: 400px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    animation: toastSlideIn 0.3s ease;
}

.toast.removing {
    animation: toastSlideOut 0.3s ease forwards;
}

@keyframes toastSlideIn {
    from {
        opacity: 0;
        transform: translateX(50px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes toastSlideOut {
    to {
        opacity: 0;
        transform: translateX(50px);
    }
}

.toast-icon {
    font-size: 18px;
    flex-shrink: 0;
}

.toast-icon.success { color: #28c940; }
.toast-icon.error { color: #ff5f57; }
.toast-icon.warning { color: #ffbd2e; }
.toast-icon.info { color: #4fc3f7; }

.toast-content {
    flex: 1;
}

.toast-title {
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 2px;
}

.toast-message {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
}

.toast-close {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.3);
    transition: all 0.2s ease;
    font-size: 12px;
    flex-shrink: 0;
}

.toast-close:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}

/* ========================================================================
   DIALOG/MODAL
   ======================================================================== */
#dialog-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 55000;
    display: none;
    align-items: center;
    justify-content: center;
    animation: dialogFadeIn 0.2s ease;
}

#dialog-overlay.visible {
    display: flex;
}

@keyframes dialogFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.dialog {
    background: rgba(35, 35, 50, 0.98);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    min-width: 400px;
    max-width: 600px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: dialogSlideIn 0.3s ease;
}

@keyframes dialogSlideIn {
    from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.dialog-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.dialog-title {
    font-size: 18px;
    font-weight: 500;
    color: #fff;
}

.dialog-body {
    padding: 20px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.6;
}

.dialog-input {
    width: 100%;
    padding: 10px 15px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    outline: none;
    margin-top: 10px;
}

.dialog-input:focus {
    border-color: #4fc3f7;
}

.dialog-footer {
    padding: 15px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.dialog-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.dialog-btn.primary {
    background: #4fc3f7;
    color: #fff;
}

.dialog-btn.primary:hover {
    background: #81d4fa;
}

.dialog-btn.secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #e0e0e0;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.dialog-btn.secondary:hover {
    background: rgba(255, 255, 255, 0.15);
}

.dialog-btn.danger {
    background: rgba(255, 107, 107, 0.2);
    color: #ff6b6b;
    border: 1px solid rgba(255, 107, 107, 0.3);
}

.dialog-btn.danger:hover {
    background: rgba(255, 107, 107, 0.3);
}

/* ========================================================================
   LOADING SPINNER
   ======================================================================== */
.spinner {
    width: 30px;
    height: 30px;
    border: 3px solid rgba(79, 195, 247, 0.2);
    border-top-color: #4fc3f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ========================================================================
   SCROLLBAR STYLES
   ======================================================================== */
::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.02);
}

::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.25);
}

/* ========================================================================
   RESPONSIVE STYLES
   ======================================================================== */
@media (max-width: 768px) {
    #start-menu {
        width: calc(100% - 20px);
        height: calc(100vh - 80px);
        left: 10px;
        bottom: 58px;
    }

    .start-menu-pinned-grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .desktop-icons {
        display: none;
    }

    .taskbar-search {
        display: none;
    }

    .window {
        min-width: 280px;
    }

    .window.maximized {
        border-radius: 0;
    }

    .file-manager-sidebar,
    .notes-sidebar,
    .chat-sidebar,
    .settings-sidebar,
    .music-player-sidebar,
    .tetris-sidebar {
        width: 180px;
    }

    .snake-mobile-controls {
        display: flex;
    }
}

/* ========================================================================
   ANIMATIONS AND UTILITIES
   ======================================================================== */
.fade-in {
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.slide-up {
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.pulse {
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* Hidden utility */
.hidden {
    display: none !important;
}

/* Prevent text selection during drag */
.no-select {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

</style>

// ========================================================================
// BOOT SEQUENCE
// ========================================================================
const BootSequence = {
    stages: [
        { text: 'Initializing hardware...', duration: 400 },
        { text: 'Loading kernel modules...', duration: 500 },
        { text: 'Mounting file systems...', duration: 400 },
        { text: 'Starting network services...', duration: 600 },
        { text: 'Loading user preferences...', duration: 400 },
        { text: 'Starting display manager...', duration: 500 },
        { text: 'Loading applications...', duration: 600 },
        { text: 'System ready.', duration: 300 }
    ],
    
    async start() {
        const progressBar = document.getElementById('boot-progress-bar');
        const statusText = document.getElementById('boot-status');
        const totalDuration = this.stages.reduce((sum, s) => sum + s.duration, 0);
        let elapsed = 0;
        
        for (const stage of this.stages) {
            statusText.textContent = stage.text;
            elapsed += stage.duration;
            const progress = (elapsed / totalDuration) * 100;
            progressBar.style.width = progress + '%';
            await this.sleep(stage.duration);
        }
        
        await this.sleep(500);
        document.getElementById('boot-screen').classList.add('hidden');
        
        setTimeout(() => {
            document.getElementById('boot-screen').style.display = 'none';
            this.showLogin();
        }, 1000);
    },
    
    showLogin() {
        document.getElementById('login-screen').classList.add('visible');
        this.updateLoginTime();
        this.loginTimeInterval = setInterval(() => this.updateLoginTime(), 1000);
    },
    
    updateLoginTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('login-time').textContent = `${hours}:${minutes}`;
        
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                       'July', 'August', 'September', 'October', 'November', 'December'];
        const dayName = days[now.getDay()];
        const monthName = months[now.getMonth()];
        const date = now.getDate();
        document.getElementById('login-date').textContent = `${dayName}, ${monthName} ${date}`;
    },
    
    sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
};

// ========================================================================
// DESKTOP MANAGER
// ========================================================================
const Desktop = {
    init() {
        const desktop = document.getElementById('desktop');
        desktop.classList.add('visible');
        document.getElementById('taskbar').classList.add('visible');
        
        this.renderIcons();
        this.initContextMenu();
        this.initSelection();
        this.initClock();
        this.initTray();
        StartMenu.init();
        Taskbar.init();
        
        // Load settings
        this.loadSettings();
        
        ZenOS.booted = true;
    },
    
    renderIcons() {
        const container = document.getElementById('desktop-icons');
        const desktopApps = [
            'sonoma',
            'file-manager', 'text-editor', 'terminal', 'browser',
            'settings', 'paint', 'calculator', 'notes', 'camera'
        ];
        
        container.innerHTML = desktopApps.map(appId => {
            const app = AppDefinitions[appId];
            return `
                <div class="desktop-icon" data-app="${appId}" ondblclick="AppManager.open('${appId}')">
                    <div class="desktop-icon-image">${app.icon}</div>
                    <div class="desktop-icon-label">${app.name}</div>
                </div>
            `;
        }).join('');
        
        // Click to select
        container.querySelectorAll('.desktop-icon').forEach(icon => {
            icon.addEventListener('click', (e) => {
                container.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
                icon.classList.add('selected');
                e.stopPropagation();
            });
        });
    },
    
    initContextMenu() {
        const desktop = document.getElementById('desktop');
        const contextMenu = document.getElementById('context-menu');
        
        desktop.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            this.showContextMenu(e.clientX, e.clientY);
        });
        
        document.addEventListener('click', () => {
            contextMenu.style.display = 'none';
        });
    },
    
    showContextMenu(x, y) {
        const menu = document.getElementById('context-menu');
        menu.innerHTML = `
            <div class="context-menu-item" onclick="Desktop.refreshDesktop()">
                <span class="context-menu-item-icon">🔄</span>
                <span>Refresh</span>
            </div>
            <div class="context-menu-separator"></div>
            <div class="context-menu-item" onclick="AppManager.open('settings')">
                <span class="context-menu-item-icon">⚙️</span>
                <span>Display Settings</span>
            </div>
            <div class="context-menu-item" onclick="AppManager.open('settings')">
                <span class="context-menu-item-icon">🎨</span>
                <span>Personalize</span>
            </div>
            <div class="context-menu-separator"></div>
            <div class="context-menu-item" onclick="AppManager.open('file-manager')">
                <span class="context-menu-item-icon">📁</span>
                <span>Open File Manager</span>
            </div>
            <div class="context-menu-item" onclick="AppManager.open('terminal')">
                <span class="context-menu-item-icon">💻</span>
                <span>Open Terminal</span>
            </div>
            <div class="context-menu-separator"></div>
            <div class="context-menu-item" onclick="AppManager.open('task-manager')">
                <span class="context-menu-item-icon">📊</span>
                <span>Task Manager</span>
                <span class="context-menu-item-shortcut">Ctrl+Shift+Esc</span>
            </div>
        `;
        
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.style.display = 'block';
        
        // Adjust if menu goes off screen
        const rect = menu.getBoundingClientRect();
        if (rect.right > window.innerWidth) {
            menu.style.left = (x - rect.width) + 'px';
        }
        if (rect.bottom > window.innerHeight) {
            menu.style.top = (y - rect.height) + 'px';
        }
    },
    
    refreshDesktop() {
        Toast.show('Desktop Refreshed', 'Desktop icons have been refreshed.', 'info');
    },
    
    initSelection() {
        const desktop = document.getElementById('desktop');
        const selectionBox = document.getElementById('selection-box');
        let isSelecting = false;
        let startX, startY;
        
        desktop.addEventListener('mousedown', (e) => {
            if (e.target === desktop || e.target.id === 'desktop-icons') {
                isSelecting = true;
                startX = e.clientX;
                startY = e.clientY;
                selectionBox.style.left = startX + 'px';
                selectionBox.style.top = startY + 'px';
                selectionBox.style.width = '0px';
                selectionBox.style.height = '0px';
                
                document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
            }
        });
        
        desktop.addEventListener('mousemove', (e) => {
            if (!isSelecting) return;
            selectionBox.style.display = 'block';
            
            const currentX = e.clientX;
            const currentY = e.clientY;
            const left = Math.min(startX, currentX);
            const top = Math.min(startY, currentY);
            const width = Math.abs(currentX - startX);
            const height = Math.abs(currentY - startY);
            
            selectionBox.style.left = left + 'px';
            selectionBox.style.top = top + 'px';
            selectionBox.style.width = width + 'px';
            selectionBox.style.height = height + 'px';
        });
        
        desktop.addEventListener('mouseup', () => {
            isSelecting = false;
            selectionBox.style.display = 'none';
        });
        
        desktop.addEventListener('click', (e) => {
            if (e.target === desktop) {
                document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
            }
        });
    },
    
    initClock() {
        const updateClock = () => {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            const dateStr = `${now.getMonth() + 1}/${now.getDate()}/${now.getFullYear()}`;
            
            document.getElementById('taskbar-clock-time').textContent = timeStr;
            document.getElementById('taskbar-clock-date').textContent = dateStr;
        };
        
        updateClock();
        setInterval(updateClock, 1000);
    },
    
    initTray() {
        document.getElementById('tray-notifications').addEventListener('click', () => {
            NotificationCenter.toggle();
        });
        
        document.getElementById('tray-wifi').addEventListener('click', () => {
            Toast.show('Wi-Fi Status', 'Connected to ZenOS-Network (192.168.1.100)', 'info');
        });
        
        document.getElementById('tray-volume').addEventListener('click', () => {
            Toast.show('Volume', 'Volume: 75%', 'info');
        });
        
        document.getElementById('tray-battery').addEventListener('click', () => {
            Toast.show('Battery', 'Battery: 100% - Plugged in', 'info');
        });
    },
    
    loadSettings() {
        const saved = localStorage.getItem('zenos-settings');
        if (saved) {
            try {
                const settings = JSON.parse(saved);
                Object.assign(ZenOS.settings, settings);
                this.applyTheme(ZenOS.settings.theme);
            } catch (e) {}
        }
    },
    
    saveSettings() {
        localStorage.setItem('zenos-settings', JSON.stringify(ZenOS.settings));
    },
    
    applyTheme(theme) {
        const desktop = document.getElementById('desktop');
        desktop.className = `visible theme-${theme}`;
        ZenOS.settings.theme = theme;
        this.saveSettings();
    }
};

// ========================================================================
// WINDOW MANAGER
// ========================================================================
const WindowManager = {
    create(appId, title, icon, content, options = {}) {
        const appDef = AppDefinitions[appId] || { width: 600, height: 400 };
        const id = `window-${ZenOS.nextWindowId++}`;
        const width = options.width || appDef.width;
        const height = options.height || appDef.height;
        
        // Calculate centered position with offset for multiple windows
        const offset = (Object.keys(ZenOS.windows).length % 5) * 30;
        const left = Math.max(20, (window.innerWidth - width) / 2 + offset);
        const top = Math.max(20, (window.innerHeight - height - 48) / 2 + offset);
        
        const windowEl = document.createElement('div');
        windowEl.className = 'window window-opening';
        windowEl.id = id;
        windowEl.style.width = width + 'px';
        windowEl.style.height = height + 'px';
        windowEl.style.left = left + 'px';
        windowEl.style.top = top + 'px';
        windowEl.style.zIndex = ++ZenOS.zIndex;
        
        windowEl.innerHTML = `
            <div class="window-header" data-window-id="${id}">
                <div class="window-header-icon">${icon}</div>
                <div class="window-header-title">${title}</div>
                <div class="window-controls">
                    <div class="window-control window-control-minimize" data-action="minimize" data-window-id="${id}">−</div>
                    <div class="window-control window-control-maximize" data-action="maximize" data-window-id="${id}">□</div>
                    <div class="window-control window-control-close" data-action="close" data-window-id="${id}">×</div>
                </div>
            </div>
            <div class="window-body">${content}</div>
            <div class="window-resize-handle window-resize-n" data-direction="n"></div>
            <div class="window-resize-handle window-resize-s" data-direction="s"></div>
            <div class="window-resize-handle window-resize-e" data-direction="e"></div>
            <div class="window-resize-handle window-resize-w" data-direction="w"></div>
            <div class="window-resize-handle window-resize-ne" data-direction="ne"></div>
            <div class="window-resize-handle window-resize-nw" data-direction="nw"></div>
            <div class="window-resize-handle window-resize-se" data-direction="se"></div>
            <div class="window-resize-handle window-resize-sw" data-direction="sw"></div>
        `;
        
        document.getElementById('desktop').appendChild(windowEl);
        
        // Store window info
        ZenOS.windows[id] = {
            id, appId, title, icon,
            element: windowEl,
            state: 'normal',
            prevState: { left, top, width, height },
            minimized: false
        };
        ZenOS.windowOrder.push(id);
        
        // Setup interactions
        this.setupDrag(id);
        this.setupResize(id);
        this.setupControls(id);
        this.setupFocus(id);
        
        // Remove opening animation class
        setTimeout(() => {
            windowEl.classList.remove('window-opening');
        }, 300);
        
        // Focus this window
        this.focus(id);
        
        // Update taskbar
        Taskbar.update();
        
        return id;
    },
    
    setupDrag(windowId) {
        const windowData = ZenOS.windows[windowId];
        const header = windowData.element.querySelector('.window-header');
        let isDragging = false;
        let startX, startY, startLeft, startTop;
        
        header.addEventListener('mousedown', (e) => {
            if (e.target.closest('.window-controls')) return;
            if (windowData.state === 'maximized') return;
            
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startLeft = parseInt(windowData.element.style.left);
            startTop = parseInt(windowData.element.style.top);
            
            document.body.classList.add('no-select');
            e.preventDefault();
        });
        
        header.addEventListener('dblclick', (e) => {
            if (e.target.closest('.window-controls')) return;
            this.toggleMaximize(windowId);
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            windowData.element.style.left = (startLeft + deltaX) + 'px';
            windowData.element.style.top = Math.max(0, startTop + deltaY) + 'px';
        });
        
        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                document.body.classList.remove('no-select');
            }
        });
    },
    
    setupResize(windowId) {
        const windowData = ZenOS.windows[windowId];
        const handles = windowData.element.querySelectorAll('.window-resize-handle');
        let isResizing = false;
        let direction, startX, startY, startWidth, startHeight, startLeft, startTop;
        
        handles.forEach(handle => {
            handle.addEventListener('mousedown', (e) => {
                if (windowData.state === 'maximized') return;
                
                isResizing = true;
                direction = handle.dataset.direction;
                startX = e.clientX;
                startY = e.clientY;
                startWidth = parseInt(windowData.element.style.width);
                startHeight = parseInt(windowData.element.style.height);
                startLeft = parseInt(windowData.element.style.left);
                startTop = parseInt(windowData.element.style.top);
                
                document.body.classList.add('no-select');
                e.preventDefault();
            });
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            const minWidth = 300;
            const minHeight = 200;
            
            let newWidth = startWidth;
            let newHeight = startHeight;
            let newLeft = startLeft;
            let newTop = startTop;
            
            if (direction.includes('e')) newWidth = Math.max(minWidth, startWidth + deltaX);
            if (direction.includes('s')) newHeight = Math.max(minHeight, startHeight + deltaY);
            if (direction.includes('w')) {
                newWidth = Math.max(minWidth, startWidth - deltaX);
                if (newWidth > minWidth) newLeft = startLeft + deltaX;
            }
            if (direction.includes('n')) {
                newHeight = Math.max(minHeight, startHeight - deltaY);
                if (newHeight > minHeight) newTop = startTop + deltaY;
            }
            
            windowData.element.style.width = newWidth + 'px';
            windowData.element.style.height = newHeight + 'px';
            windowData.element.style.left = newLeft + 'px';
            windowData.element.style.top = newTop + 'px';
        });
        
        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.classList.remove('no-select');
            }
        });
    },
    
    setupControls(windowId) {
        const windowData = ZenOS.windows[windowId];
        const controls = windowData.element.querySelectorAll('.window-control');
        
        controls.forEach(control => {
            control.addEventListener('click', () => {
                const action = control.dataset.action;
                switch (action) {
                    case 'minimize':
                        this.minimize(windowId);
                        break;
                    case 'maximize':
                        this.toggleMaximize(windowId);
                        break;
                    case 'close':
                        this.close(windowId);
                        break;
                }
            });
        });
    },
    
    setupFocus(windowId) {
        const windowData = ZenOS.windows[windowId];
        windowData.element.addEventListener('mousedown', () => {
            this.focus(windowId);
        });
    },
    
    focus(windowId) {
        if (ZenOS.activeWindowId === windowId) return;
        
        // Remove focus from all windows
        Object.values(ZenOS.windows).forEach(w => {
            w.element.classList.remove('focused');
        });
        
        // Focus this window
        const windowData = ZenOS.windows[windowId];
        if (windowData) {
            windowData.element.style.zIndex = ++ZenOS.zIndex;
            windowData.element.classList.add('focused');
            ZenOS.activeWindowId = windowId;
        }
        
        Taskbar.update();
    },
    
    minimize(windowId) {
        const windowData = ZenOS.windows[windowId];
        if (!windowData) return;
        
        windowData.minimized = true;
        windowData.element.classList.add('minimized');
        
        if (ZenOS.activeWindowId === windowId) {
            ZenOS.activeWindowId = null;
        }
        
        Taskbar.update();
    },
    
    restore(windowId) {
        const windowData = ZenOS.windows[windowId];
        if (!windowData) return;
        
        windowData.minimized = false;
        windowData.element.classList.remove('minimized');
        this.focus(windowId);
        Taskbar.update();
    },
    
    toggleMaximize(windowId) {
        const windowData = ZenOS.windows[windowId];
        if (!windowData) return;
        
        if (windowData.state === 'maximized') {
            // Restore
            windowData.element.classList.remove('maximized');
            windowData.element.style.left = windowData.prevState.left + 'px';
            windowData.element.style.top = windowData.prevState.top + 'px';
            windowData.element.style.width = windowData.prevState.width + 'px';
            windowData.element.style.height = windowData.prevState.height + 'px';
            windowData.state = 'normal';
        } else {
            // Maximize
            windowData.prevState = {
                left: parseInt(windowData.element.style.left),
                top: parseInt(windowData.element.style.top),
                width: parseInt(windowData.element.style.width),
                height: parseInt(windowData.element.style.height)
            };
            windowData.element.classList.add('maximized');
            windowData.state = 'maximized';
        }
    },
    
    close(windowId) {
        const windowData = ZenOS.windows[windowId];
        if (!windowData) return;
        
        windowData.element.classList.add('window-closing');
        
        setTimeout(() => {
            windowData.element.remove();
            delete ZenOS.windows[windowId];
            ZenOS.windowOrder = ZenOS.windowOrder.filter(id => id !== windowId);
            
            if (ZenOS.activeWindowId === windowId) {
                ZenOS.activeWindowId = null;
                // Focus previous window
                if (ZenOS.windowOrder.length > 0) {
                    this.focus(ZenOS.windowOrder[ZenOS.windowOrder.length - 1]);
                }
            }
            
            Taskbar.update();
        }, 200);
    },
    
    closeAll() {
        Object.keys(ZenOS.windows).forEach(id => this.close(id));
    }
};

// ========================================================================
// TASKBAR MANAGER
// ========================================================================
const Taskbar = {
    init() {
        // Start button
        document.getElementById('taskbar-start').addEventListener('click', () => {
            StartMenu.toggle();
        });
        
        // Search
        document.getElementById('taskbar-search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value.trim().toLowerCase();
                if (query) {
                    const found = Object.entries(AppDefinitions).find(([id, app]) => 
                        app.name.toLowerCase().includes(query)
                    );
                    if (found) {
                        AppManager.open(found[0]);
                        e.target.value = '';
                    } else {
                        Toast.show('Not Found', `No app found matching "${query}"`, 'warning');
                    }
                }
            }
        });
    },
    
    update() {
        const container = document.getElementById('taskbar-apps');
        container.innerHTML = '';
        
        Object.values(ZenOS.windows).forEach(windowData => {
            const isActive = ZenOS.activeWindowId === windowData.id && !windowData.minimized;
            const isMinimized = windowData.minimized;
            
            const appEl = document.createElement('div');
            appEl.className = `taskbar-app${isActive ? ' active' : ''}${isMinimized ? ' minimized' : ''}`;
            appEl.innerHTML = `
                <div class="taskbar-app-icon">${windowData.icon}</div>
                <div class="taskbar-app-title">${windowData.title}</div>
            `;
            
            appEl.addEventListener('click', () => {
                if (windowData.minimized) {
                    WindowManager.restore(windowData.id);
                } else if (ZenOS.activeWindowId === windowData.id) {
                    WindowManager.minimize(windowData.id);
                } else {
                    WindowManager.focus(windowData.id);
                }
            });
            
            container.appendChild(appEl);
        });
    }
};

// ========================================================================
// START MENU
// ========================================================================
const StartMenu = {
    init() {
        this.render();
        
        document.getElementById('start-menu-search-input').addEventListener('input', (e) => {
            this.filterApps(e.target.value);
        });
        
        // Power buttons
        document.getElementById('power-lock').addEventListener('click', () => {
            this.close();
            this.lock();
        });
        
        document.getElementById('power-restart').addEventListener('click', () => {
            Dialog.confirm('Restart', 'Are you sure you want to restart ZenOS?', () => {
                location.reload();
            });
        });
        
        document.getElementById('power-shutdown').addEventListener('click', () => {
            Dialog.confirm('Shut Down', 'Are you sure you want to shut down ZenOS?', () => {
                this.shutdown();
            });
        });
        
        // Close when clicking outside
        document.addEventListener('click', (e) => {
            const startMenu = document.getElementById('start-menu');
            const startBtn = document.getElementById('taskbar-start');
            if (!startMenu.contains(e.target) && !startBtn.contains(e.target)) {
                this.close();
            }
        });
    },
    
    render() {
        // Pinned apps
        const pinnedContainer = document.getElementById('start-menu-pinned');
        const pinnedApps = ['file-manager', 'browser', 'text-editor', 'paint', 'settings', 
                           'calculator', 'music-player', 'terminal', 'notes', 'calendar',
                           'weather', 'camera'];
        
        pinnedContainer.innerHTML = pinnedApps.map(appId => {
            const app = AppDefinitions[appId];
            return `
                <div class="start-menu-pinned-item" onclick="AppManager.open('${appId}'); StartMenu.close();">
                    <div class="start-menu-pinned-icon">${app.icon}</div>
                    <div class="start-menu-pinned-label">${app.name}</div>
                </div>
            `;
        }).join('');
        
        // All apps
        const allAppsContainer = document.getElementById('start-menu-all-apps');
        const sortedApps = Object.entries(AppDefinitions).sort((a, b) => 
            a[1].name.localeCompare(b[1].name)
        );
        
        allAppsContainer.innerHTML = sortedApps.map(([appId, app]) => `
            <div class="start-menu-all-apps-item" data-name="${app.name.toLowerCase()}" onclick="AppManager.open('${appId}'); StartMenu.close();">
                <div class="start-menu-all-apps-icon">${app.icon}</div>
                <div class="start-menu-all-apps-name">${app.name}</div>
            </div>
        `).join('');
    },
    
    filterApps(query) {
        const items = document.querySelectorAll('.start-menu-all-apps-item');
        query = query.toLowerCase();
        items.forEach(item => {
            const name = item.dataset.name;
            item.style.display = name.includes(query) ? '' : 'none';
        });
    },
    
    toggle() {
        const menu = document.getElementById('start-menu');
        const btn = document.getElementById('taskbar-start');
        if (menu.classList.contains('visible')) {
            this.close();
        } else {
            menu.classList.add('visible');
            btn.classList.add('active');
        }
    },
    
    close() {
        document.getElementById('start-menu').classList.remove('visible');
        document.getElementById('taskbar-start').classList.remove('active');
    },
    
    lock() {
        WindowManager.closeAll();
        document.getElementById('desktop').classList.remove('visible');
        document.getElementById('taskbar').classList.remove('visible');
        document.getElementById('login-screen').style.display = '';
        document.getElementById('login-screen').classList.add('visible');
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('login-password').value = '';
        BootSequence.showLogin();
        ZenOS.loggedIn = false;
    },
    
    shutdown() {
        const desktop = document.getElementById('desktop');
        desktop.style.transition = 'opacity 1s ease';
        desktop.style.opacity = '0';
        document.getElementById('taskbar').style.transition = 'opacity 1s ease';
        document.getElementById('taskbar').style.opacity = '0';
        
        setTimeout(() => {
            document.body.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #000; color: #fff; font-size: 24px; flex-direction: column; gap: 20px;">
                    <div>It is now safe to close this tab.</div>
                    <div style="font-size: 14px; color: #666;">ZenOS has been shut down.</div>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 30px; background: #4fc3f7; border: none; color: #fff; border-radius: 5px; cursor: pointer; font-size: 14px;">Restart</button>
                </div>
            `;
        }, 1500);
    }
};

// ========================================================================
// NOTIFICATION CENTER
// ========================================================================
const NotificationCenter = {
    toggle() {
        const panel = document.getElementById('notification-center');
        panel.classList.toggle('visible');
        if (panel.classList.contains('visible')) {
            this.render();
        }
    },
    
    add(appIcon, title, body) {
        const notification = {
            id: Date.now(),
            appIcon,
            title,
            body,
            time: new Date()
        };
        ZenOS.notifications.unshift(notification);
        if (ZenOS.notifications.length > 50) ZenOS.notifications.pop();
        
        if (document.getElementById('notification-center').classList.contains('visible')) {
            this.render();
        }
    },
    
    render() {
        const container = document.getElementById('notification-list');
        if (ZenOS.notifications.length === 0) {
            container.innerHTML = `
                <div class="notification-empty">
                    <div class="notification-empty-icon">🔔</div>
                    <div class="notification-empty-text">No notifications</div>
                </div>
            `;
            return;
        }
        
        container.innerHTML = ZenOS.notifications.map(n => {
            const timeAgo = this.getTimeAgo(n.time);
            return `
                <div class="notification-item">
                    <div class="notification-item-header">
                        <span>${n.appIcon}</span>
                        <span class="notification-item-app">${n.title.split(' - ')[0]}</span>
                        <span class="notification-item-time">${timeAgo}</span>
                    </div>
                    <div class="notification-item-title">${n.title}</div>
                    <div class="notification-item-body">${n.body}</div>
                </div>
            `;
        }).join('');
    },
    
    clear() {
        ZenOS.notifications = [];
        this.render();
    },
    
    getTimeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return 'Just now';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        return `${Math.floor(hours / 24)}d ago`;
    }
};

// ========================================================================
const Toast = {
    show(title, message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        
        const icons = {
            success: '✓',
            error: '✕',
            warning: '⚠',
            info: 'ℹ'
        };
        
        toast.innerHTML = `
            <div class="toast-icon ${type}">${icons[type] || icons.info}</div>
            <div class="toast-content">
                <div class="toast-title">${title}</div>
                <div class="toast-message">${message}</div>
            </div>
            <div class="toast-close" onclick="this.parentElement.classList.add('removing'); setTimeout(() => this.parentElement.remove(), 300);">×</div>
        `;
        
        container.appendChild(toast);
        
        // Auto remove after 4 seconds
        setTimeout(() => {
            if (toast.parentElement) {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }
        }, 4000);
    }
};

// ========================================================================
// DIALOG SYSTEM
// ========================================================================
const Dialog = {
    show(title, body, buttons = []) {
        const overlay = document.getElementById('dialog-overlay');
        const dialog = document.getElementById('dialog');
        
        let buttonsHtml = buttons.map((btn, i) => `
            <button class="dialog-btn ${btn.class || 'secondary'}" onclick="Dialog.handleButton(${i})">${btn.text}</button>
        `).join('');
        
        if (buttons.length === 0) {
            buttonsHtml = `<button class="dialog-btn primary" onclick="Dialog.close()">OK</button>`;
        }
        
        dialog.innerHTML = `
            <div class="dialog-header">
                <div class="dialog-title">${title}</div>
            </div>
            <div class="dialog-body">${body}</div>
            <div class="dialog-footer">${buttonsHtml}</div>
        `;
        
        overlay.classList.add('visible');
        this.currentButtons = buttons;
    },
    
    confirm(title, message, onConfirm) {
        this.show(title, `<p>${message}</p>`, [
            { text: 'Cancel', class: 'secondary', action: () => this.close() },
            { text: 'Confirm', class: 'primary', action: () => { this.close(); onConfirm(); } }
        ]);
    },
    
    prompt(title, message, defaultValue, onConfirm) {
        this.show(title, `
            <p>${message}</p>
            <input type="text" class="dialog-input" id="dialog-prompt-input" value="${defaultValue || ''}">
        `, [
            { text: 'Cancel', class: 'secondary', action: () => this.close() },
            { text: 'OK', class: 'primary', action: () => {
                const value = document.getElementById('dialog-prompt-input').value;
                this.close();
                onConfirm(value);
            }}
        ]);
        
        setTimeout(() => {
            const input = document.getElementById('dialog-prompt-input');
            if (input) {
                input.focus();
                input.select();
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const value = input.value;
                        this.close();
                        onConfirm(value);
                    }
                });
            }
        }, 100);
    },
    
    alert(title, message) {
        this.show(title, `<p>${message}</p>`);
    },
    
    handleButton(index) {
        if (this.currentButtons && this.currentButtons[index]) {
            this.currentButtons[index].action();
        }
    },
    
    close() {
        document.getElementById('dialog-overlay').classList.remove('visible');
        this.currentButtons = null;
    }
};

const AppManager = {
    open(appId) {
        // Sonoma is the way back to the main site.
        if (appId === 'sonoma') {
            window.location.href = '/';
            return;
        }
        const app = AppDefinitions[appId];
        if (!app) return;

        // Check if already open
        const existing = Object.values(ZenOS.windows).find(w => w.appId === appId);
        if (existing && !existing.minimized) {
            WindowManager.focus(existing.id);
            return;
        }
        if (existing && existing.minimized) {
            WindowManager.restore(existing.id);
            return;
        }
        
        // Create content based on app
        const content = this.getContent(appId);
        const windowId = WindowManager.create(appId, app.name, app.icon, content);
        
        // Initialize app
        this.initialize(appId, windowId);
    },
    
    getContent(appId) {
        switch (appId) {
            case 'file-manager': return Apps.FileManager.getHTML();
            case 'text-editor': return Apps.TextEditor.getHTML();
            case 'calculator': return Apps.Calculator.getHTML();
            case 'paint': return Apps.Paint.getHTML();
            case 'terminal': return Apps.Terminal.getHTML();
            case 'browser': return Apps.Browser.getHTML();
            case 'settings': return Apps.Settings.getHTML();
            case 'clock': return Apps.Clock.getHTML();
            case 'calendar': return Apps.Calendar.getHTML();
            case 'music-player': return Apps.MusicPlayer.getHTML();
            case 'photo-viewer': return Apps.PhotoViewer.getHTML();
            case 'notes': return Apps.Notes.getHTML();
            case 'weather': return Apps.Weather.getHTML();
            case 'minesweeper': return Apps.Minesweeper.getHTML();
            case 'snake': return Apps.Snake.getHTML();
            case 'tetris': return Apps.Tetris.getHTML();
            case 'camera': return Apps.Camera.getHTML();
            case 'task-manager': return Apps.TaskManager.getHTML();

            case 'system-monitor': return Apps.SystemMonitor.getHTML();
            default: return '<div style="padding: 20px; color: #fff;">App content loading...</div>';
        }
    },
    
    initialize(appId, windowId) {

            switch (appId) {
                case 'file-manager': Apps.FileManager.init(windowId); break;
                case 'text-editor': Apps.TextEditor.init(windowId); break;
                case 'calculator': Apps.Calculator.init(windowId); break;
                case 'paint': Apps.Paint.init(windowId); break;
                case 'terminal': Apps.Terminal.init(windowId); break;
                case 'browser': Apps.Browser.init(windowId); break;
                case 'settings': Apps.Settings.init(windowId); break;
                case 'clock': Apps.Clock.init(windowId); break;
                case 'calendar': Apps.Calendar.init(windowId); break;
                case 'music-player': Apps.MusicPlayer.init(windowId); break;
                case 'photo-viewer': Apps.PhotoViewer.init(windowId); break;
                case 'notes': Apps.Notes.init(windowId); break;
                case 'weather': Apps.Weather.init(windowId); break;
                case 'minesweeper': Apps.Minesweeper.init(windowId); break;
                case 'snake': Apps.Snake.init(windowId); break;
                case 'tetris': Apps.Tetris.init(windowId); break;
                case 'camera': Apps.Camera.init(windowId); break;
                case 'task-manager': Apps.TaskManager.init(windowId); break;
                case 'app-store': Apps.AppStore.init(windowId); break;

                case 'music-visualizer': Apps.MusicVisualizer.init(windowId); break;
