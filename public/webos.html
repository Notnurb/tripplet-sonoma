                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        this.canvas = document.getElementById('snake-canvas');
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        this.cellSize = this.canvas ? this.canvas.width / this.gridSize : 20;
        
        const saved = localStorage.getItem('zenos-snake-highscore');
        if (saved) this.highScore = parseInt(saved);
        document.getElementById('snake-high-score').textContent = this.highScore;
        
        this.reset();
        
        document.addEventListener('keydown', (e) => {
            if (!ZenOS.windows[windowId]) return;
            const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
            if (keys[e.key]) {
                e.preventDefault();
                this.setDirection(keys[e.key]);
            }
            if (e.key === ' ') {
                e.preventDefault();
                this.toggleGame();
            }
        });
    },
    
    reset() {
        this.snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        this.direction = 'right';
        this.nextDirection = 'right';
        this.score = 0;
        this.gameOver = false;
        this.placeFood();
        this.updateScore();
        this.render();
        
        if (this.interval) {
            clearInterval(this.interval);
            this.interval = null;
        }
        this.running = false;
        
        const overlay = document.getElementById('snake-overlay');
        const btn = document.getElementById('snake-start-btn');
        if (overlay) overlay.style.display = '';
        if (btn) {
            btn.textContent = 'Start';
            btn.className = 'snake-btn start';
        }
    },
    
    toggleGame() {
        if (this.gameOver) {
            this.reset();
            return;
        }
        
        if (this.running) {
            this.pause();
        } else {
            this.start();
        }
    },
    
    start() {
        this.running = true;
        document.getElementById('snake-overlay').style.display = 'none';
        const btn = document.getElementById('snake-start-btn');
        if (btn) {
            btn.textContent = 'Pause';
            btn.className = 'snake-btn pause';
        }
        
        this.interval = setInterval(() => this.update(), this.speed);
    },
    
    pause() {
        this.running = false;
        clearInterval(this.interval);
        this.interval = null;
        const btn = document.getElementById('snake-start-btn');
        if (btn) {
            btn.textContent = 'Resume';
            btn.className = 'snake-btn start';
        }
    },
    
    setDirection(dir) {
        const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
        if (dir !== opposites[this.direction]) {
            this.nextDirection = dir;
        }
    },
    
    placeFood() {
        do {
            this.food = {
                x: Math.floor(Math.random() * this.gridSize),
                y: Math.floor(Math.random() * this.gridSize)
            };
        } while (this.snake.some(s => s.x === this.food.x && s.y === this.food.y));
    },
    
    update() {
        this.direction = this.nextDirection;
        
        const head = { ...this.snake[0] };
        switch (this.direction) {
            case 'up': head.y--; break;
            case 'down': head.y++; break;
            case 'left': head.x--; break;
            case 'right': head.x++; break;
        }
        
        // Check wall collision
        if (head.x < 0 || head.x >= this.gridSize || head.y < 0 || head.y >= this.gridSize) {
            this.endGame();
            return;
        }
        
        // Check self collision
        if (this.snake.some(s => s.x === head.x && s.y === head.y)) {
            this.endGame();
            return;
        }
        
        this.snake.unshift(head);
        
        // Check food
        if (head.x === this.food.x && head.y === this.food.y) {
            this.score += 10;
            this.updateScore();
            this.placeFood();
            // Speed up slightly
            if (this.speed > 60) {
                this.speed -= 2;
                clearInterval(this.interval);
                this.interval = setInterval(() => this.update(), this.speed);
            }
        } else {
            this.snake.pop();
        }
        
        this.render();
    },
    
    render() {
        if (!this.ctx) return;
        
        const cs = this.cellSize;
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw grid
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
        for (let i = 0; i <= this.gridSize; i++) {
            this.ctx.beginPath();
            this.ctx.moveTo(i * cs, 0);
            this.ctx.lineTo(i * cs, this.canvas.height);
            this.ctx.stroke();
            this.ctx.beginPath();
            this.ctx.moveTo(0, i * cs);
            this.ctx.lineTo(this.canvas.width, i * cs);
            this.ctx.stroke();
        }
        
        // Draw food
        if (this.food) {
            this.ctx.fillStyle = '#ff5f57';
            this.ctx.beginPath();
            this.ctx.arc(this.food.x * cs + cs / 2, this.food.y * cs + cs / 2, cs / 2 - 2, 0, Math.PI * 2);
            this.ctx.fill();
        }
        
        // Draw snake
        this.snake.forEach((segment, i) => {
            if (i === 0) {
                this.ctx.fillStyle = '#4fc3f7';
                this.ctx.shadowBlur = 10;
                this.ctx.shadowColor = '#4fc3f7';
            } else {
                this.ctx.fillStyle = `rgba(79, 195, 247, ${1 - i / this.snake.length * 0.5})`;
                this.ctx.shadowBlur = 0;
            }
            this.ctx.fillRect(segment.x * cs + 1, segment.y * cs + 1, cs - 2, cs - 2);
        });
        this.ctx.shadowBlur = 0;
    },
    
    endGame() {
        this.gameOver = true;
        this.running = false;
        clearInterval(this.interval);
        
        if (this.score > this.highScore) {
            this.highScore = this.score;
            localStorage.setItem('zenos-snake-highscore', this.highScore);
            document.getElementById('snake-high-score').textContent = this.highScore;
        }
        
        const overlay = document.getElementById('snake-overlay');
        if (overlay) {
            overlay.style.display = '';
            document.getElementById('snake-overlay-text').textContent = 'Game Over';
            document.getElementById('snake-overlay-score').textContent = `Score: ${this.score}`;
        }
        
        const btn = document.getElementById('snake-start-btn');
        if (btn) {
            btn.textContent = 'Play Again';
            btn.className = 'snake-btn start';
        }
    },
    
    updateScore() {
        const scoreEl = document.getElementById('snake-score');
        if (scoreEl) scoreEl.textContent = this.score;
    }
};

                    </div>

    },
    
    init(windowId) {
        this.windowId = windowId;
        this.canvas = document.getElementById('tetris-canvas');
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        
        this.resetBoard();
        this.render();
        
        document.addEventListener('keydown', (e) => {
            if (!ZenOS.windows[windowId] || !this.running) return;
            switch (e.key) {
                case 'ArrowLeft': e.preventDefault(); this.movePiece(-1, 0); break;
                case 'ArrowRight': e.preventDefault(); this.movePiece(1, 0); break;
                case 'ArrowDown': e.preventDefault(); this.movePiece(0, 1); this.score += 1; this.updateDisplay(); break;
                case 'ArrowUp': e.preventDefault(); this.rotatePiece(); break;
                case ' ': e.preventDefault(); this.hardDrop(); break;
            }
        });
    },
    
    resetBoard() {
        this.board = [];
        for (let r = 0; r < this.ROWS; r++) {
            this.board[r] = [];
            for (let c = 0; c < this.COLS; c++) {
                this.board[r][c] = 0;
            }
        }

        const piece = this.pieces[type];
        return {
            shape: piece.shape.map(row => [...row]),
            color: piece.color,
            type: type,
            x: Math.floor(this.COLS / 2) - Math.floor(piece.shape[0].length / 2),
            y: 0
        };
    },
    
    toggleGame() {
        if (this.gameOver) {
            this.resetGame();
            return;
        }
        
        if (this.running) {
            this.pause();
        } else {
            this.start();
        }
    },
    
    resetGame() {
        this.resetBoard();
        this.score = 0;
        this.lines = 0;
        this.level = 1;
        this.dropSpeed = 800;
        this.gameOver = false;
        this.currentPiece = this.randomPiece();
        this.nextPiece = this.randomPiece();
        this.updateDisplay();
        this.renderNextPiece();
        this.render();
        document.getElementById('tetris-overlay').style.display = 'none';
    },
    
    start() {
        if (!this.currentPiece) {
            this.resetGame();
        }
        this.running = true;
        document.getElementById('tetris-overlay').style.display = 'none';
        document.getElementById('tetris-start-btn').textContent = 'Pause';
        this.interval = setInterval(() => this.drop(), this.dropSpeed);
    },
    
    pause() {
        this.running = false;
        clearInterval(this.interval);
        document.getElementById('tetris-start-btn').textContent = 'Resume';
    },
    
    drop() {
        if (!this.movePiece(0, 1)) {
            this.lockPiece();
            this.clearLines();
            this.currentPiece = this.nextPiece;
            this.nextPiece = this.randomPiece();
            this.renderNextPiece();
            
            if (this.collides(this.currentPiece, 0, 0)) {
                this.endGame();
                return;
            }
        }
        this.render();
    },
    
    movePiece(dx, dy) {
        if (!this.currentPiece) return false;
        if (!this.collides(this.currentPiece, dx, dy)) {
            this.currentPiece.x += dx;
            this.currentPiece.y += dy;
            this.render();
            return true;
        }
        return false;
    },
    
    rotatePiece() {
        if (!this.currentPiece || this.currentPiece.type === 'O') return;
        const shape = this.currentPiece.shape;
        const rows = shape.length;
        const cols = shape[0].length;
        const rotated = [];
        for (let c = 0; c < cols; c++) {
            rotated[c] = [];
            for (let r = rows - 1; r >= 0; r--) {
                rotated[c].push(shape[r][c]);
            }
        }
        
        const oldShape = this.currentPiece.shape;
        this.currentPiece.shape = rotated;
        
        if (this.collides(this.currentPiece, 0, 0)) {
            // Wall kick - try shifting
            if (!this.collides(this.currentPiece, -1, 0)) {
                this.currentPiece.x -= 1;
            } else if (!this.collides(this.currentPiece, 1, 0)) {
                this.currentPiece.x += 1;
            } else {
                this.currentPiece.shape = oldShape;
            }
        }
        this.render();
    },
    
    hardDrop() {
        while (this.movePiece(0, 1)) {
            this.score += 2;
        }
        this.updateDisplay();
        this.lockPiece();
        this.clearLines();
        this.currentPiece = this.nextPiece;
        this.nextPiece = this.randomPiece();
        this.renderNextPiece();
        
        if (this.collides(this.currentPiece, 0, 0)) {
            this.endGame();
            return;
        }
        this.render();
    },
    
    collides(piece, dx, dy) {
        for (let r = 0; r < piece.shape.length; r++) {
            for (let c = 0; c < piece.shape[r].length; c++) {
                if (piece.shape[r][c]) {
                    const newX = piece.x + c + dx;
                    const newY = piece.y + r + dy;
                    if (newX < 0 || newX >= this.COLS || newY >= this.ROWS) return true;
                    if (newY >= 0 && this.board[newY][newX]) return true;
                }
            }
        }
        return false;
    },
    
    lockPiece() {
        for (let r = 0; r < this.currentPiece.shape.length; r++) {
            for (let c = 0; c < this.currentPiece.shape[r].length; c++) {
                if (this.currentPiece.shape[r][c]) {
                    const y = this.currentPiece.y + r;
                    const x = this.currentPiece.x + c;
                    if (y >= 0) {
                        this.board[y][x] = this.currentPiece.color;
                    }
                }
            }
        }
    },
    
    clearLines() {
        let cleared = 0;
        for (let r = this.ROWS - 1; r >= 0; r--) {
            if (this.board[r].every(cell => cell !== 0)) {
                this.board.splice(r, 1);
                this.board.unshift(new Array(this.COLS).fill(0));
                cleared++;
                r++;
            }
        }
        
        if (cleared > 0) {
            const points = [0, 100, 300, 500, 800];
            this.score += (points[cleared] || 800) * this.level;
            this.lines += cleared;
            this.level = Math.floor(this.lines / 10) + 1;
            this.dropSpeed = Math.max(100, 800 - (this.level - 1) * 70);
            
            if (this.interval) {
                clearInterval(this.interval);
                this.interval = setInterval(() => this.drop(), this.dropSpeed);
            }
            this.updateDisplay();
        }
    },
    
    render() {
        if (!this.ctx) return;
        const cs = this.cellSize;
        
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw grid
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        for (let r = 0; r <= this.ROWS; r++) {
            this.ctx.beginPath();
            this.ctx.moveTo(0, r * cs);
            this.ctx.lineTo(this.canvas.width, r * cs);
            this.ctx.stroke();
        }
        for (let c = 0; c <= this.COLS; c++) {
            this.ctx.beginPath();
            this.ctx.moveTo(c * cs, 0);
            this.ctx.lineTo(c * cs, this.canvas.height);
            this.ctx.stroke();
        }
        
        // Draw board
        for (let r = 0; r < this.ROWS; r++) {
            for (let c = 0; c < this.COLS; c++) {
                if (this.board[r][c]) {
                    this.ctx.fillStyle = this.board[r][c];
                    this.ctx.fillRect(c * cs + 1, r * cs + 1, cs - 2, cs - 2);
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    this.ctx.fillRect(c * cs + 1, r * cs + 1, cs - 2, 3);
                }
            }
        }
        
        // Draw current piece
        if (this.currentPiece) {
            this.ctx.fillStyle = this.currentPiece.color;
            for (let r = 0; r < this.currentPiece.shape.length; r++) {
                for (let c = 0; c < this.currentPiece.shape[r].length; c++) {
                    if (this.currentPiece.shape[r][c]) {
                        const x = (this.currentPiece.x + c) * cs;
                        const y = (this.currentPiece.y + r) * cs;
                        this.ctx.fillRect(x + 1, y + 1, cs - 2, cs - 2);
                        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        this.ctx.fillRect(x + 1, y + 1, cs - 2, 3);
                        this.ctx.fillStyle = this.currentPiece.color;
                    }
                }
            }
            
            // Draw ghost piece
            let ghostY = this.currentPiece.y;
            while (!this.collides({ ...this.currentPiece, y: ghostY + 1 }, 0, 0)) {
                ghostY++;
            }
            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let r = 0; r < this.currentPiece.shape.length; r++) {
                for (let c = 0; c < this.currentPiece.shape[r].length; c++) {
                    if (this.currentPiece.shape[r][c]) {
                        const x = (this.currentPiece.x + c) * cs;
                        const y = (ghostY + r) * cs;
                        this.ctx.fillRect(x + 1, y + 1, cs - 2, cs - 2);
                    }
                }
            }
        }
    },
    
    renderNextPiece() {
        const container = document.getElementById('tetris-next');
        if (!container || !this.nextPiece) return;
        
        container.innerHTML = '';
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                const cell = document.createElement('div');
                cell.className = 'tetris-next-cell';
                if (this.nextPiece.shape[r] && this.nextPiece.shape[r][c]) {
                    cell.classList.add('filled');
                    cell.style.background = this.nextPiece.color;
                }
                container.appendChild(cell);
            }
        }
    },
    
    endGame() {
        this.gameOver = true;
        this.running = false;
        clearInterval(this.interval);
        
        const overlay = document.getElementById('tetris-overlay');
        overlay.style.display = '';
        document.getElementById('tetris-overlay-text').textContent = `Game Over! Score: ${this.score}`;
        document.getElementById('tetris-start-btn').textContent = 'Play Again';
    },
    
    updateDisplay() {
        const scoreEl = document.getElementById('tetris-score');
        const linesEl = document.getElementById('tetris-lines');
        const levelEl = document.getElementById('tetris-level');
        if (scoreEl) scoreEl.textContent = this.score;
        if (linesEl) linesEl.textContent = this.lines;
        if (levelEl) levelEl.textContent = this.level;
    }
};

        const video = document.getElementById('camera-video');
        const placeholder = document.getElementById('camera-placeholder');
        if (video) video.style.display = 'none';
        if (placeholder) placeholder.style.display = '';
        Toast.show('Camera', 'Camera access is disabled in this build to keep it self-contained.', 'warning');
    },

        const video = document.getElementById('camera-video');
        if (!video || !this.stream) {
            Toast.show('Camera', 'Start the camera first!', 'warning');
            return;
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        const link = document.createElement('a');
        link.download = `zenos-photo-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        Toast.show('Camera', 'Photo captured and saved!', 'success');
    },
    
    switchMode() {
        Toast.show('Camera', 'Front/rear switch not available in browser.', 'info');
    },
    
    applyFilter() {
        const video = document.getElementById('camera-video');
        if (!video) return;
        const filters = ['none', 'grayscale(100%)', 'sepia(100%)', 'invert(100%)', 'blur(2px)', 'contrast(150%)'];
        const current = video.style.filter || 'none';
        const idx = filters.indexOf(current);
        video.style.filter = filters[(idx + 1) % filters.length];
    },
    
    cleanup() {
        if (this.stream) {
            this.stream.getTracks().forEach(track => track.stop());
            this.stream = null;
        }
    }
};

                <div class="chat-send-btn" onclick="Apps.Chat.sendMessage(${id})">➤</div>
            </div>
        `;
        
        const messages = document.getElementById('chat-messages');
        if (messages) messages.scrollTop = messages.scrollHeight;
    },
    
    sendMessage(convId) {
        const input = document.getElementById('chat-input');
        if (!input || !input.value.trim()) return;
        
        const conv = this.conversations.find(c => c.id === convId);
        if (!conv) return;
        
        const now = new Date();
        const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        conv.messages.push({ text: input.value, sent: true, time });
        conv.lastMessage = input.value;
        conv.time = time;
        input.value = '';
        
        this.openConversation(convId);
        this.renderConversations();
        
        // Simulate reply
        setTimeout(() => {
            const replies = [
                'That sounds great!',
                'I agree!',
                'Let me think about that.',
                'Interesting point!',
                'Thanks for sharing!',
                'I\'ll get back to you on that.',
                'Sure thing!',
                'Got it!'
            ];
            conv.messages.push({
                text: replies[Math.floor(Math.random() * replies.length)],
                sent: false,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            if (this.activeConversation === convId) {
                this.openConversation(convId);
            }
        }, 1500 + Math.random() * 2000);
    }
};

                            <div class="paint3d-shape-btn" onclick="Apps.Paint3D.setTool('sphere')">⚪ Sphere</div>
                            <div class="paint3d-shape-btn" onclick="Apps.Paint3D.setTool('pyramid')">🔺 Pyramid</div>
                            <div class="paint3d-shape-btn" onclick="Apps.Paint3D.setTool('cylinder')">🥫 Cylinder</div>

    },
    
    init(windowId) {
        this.windowId = windowId;
        this.canvas = document.getElementById('paint3d-canvas');
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        
        if (this.canvas) {
            const container = this.canvas.parentElement;
            this.canvas.width = container.clientWidth - 230;
            this.canvas.height = container.clientHeight;
        }
        
        this.render();
        
        if (this.canvas) {
            this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
            this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
            this.canvas.addEventListener('mouseup', () => this.handleMouseUp());
            this.canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (this.selectedObject) {
                    this.selectedObject.size += e.deltaY > 0 ? -5 : 5;
                    this.selectedObject.size = Math.max(20, Math.min(200, this.selectedObject.size));
                    this.render();
                }
            });
        }
        
        window.addEventListener('resize', () => {
            if (this.canvas && this.canvas.parentElement) {
                this.canvas.width = this.canvas.parentElement.clientWidth - 230;
                this.canvas.height = this.canvas.parentElement.clientHeight;
                this.render();
            }
        });
    },
    
    setTool(tool) {
        this.tool = tool;
        document.querySelectorAll('.paint3d-tool-btn[data-tool], .paint3d-shape-btn').forEach(btn => {
            const isTool = btn.dataset.tool === tool || btn.textContent.toLowerCase().includes(tool);
            btn.classList.toggle('active', isTool);
        });
        document.getElementById('p3d-tool-status').textContent = `Tool: ${tool.charAt(0).toUpperCase() + tool.slice(1)}`;
    },
    
    changeColor(color) {
        this.color = color;
        if (this.selectedObject) {
            this.selectedObject.color = color;
            this.render();
        }
    },
    
    handleMouseDown(e) {
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Check if clicking on existing object
        for (let i = this.objects.length - 1; i >= 0; i--) {
            const obj = this.objects[i];
            if (this.isPointInObject(x, y, obj)) {
                this.selectedObject = obj;
                this.isDragging = true;
                this.dragStart = { x: x - obj.x, y: y - obj.y };
                this.render();
                return;
            }
        }
        
        // Place new object
        const newObj = {
            id: Date.now(),
            type: this.tool,
            x: x,
            y: y,
            size: 60,
            color: this.color,
            rotation: 0
        };
        
        if (this.tool === 'text3d') {
            Dialog.prompt('3D Text', 'Enter text:', '3D', (text) => {
                if (text) {
                    newObj.text = text;
                    this.objects.push(newObj);
                    this.selectedObject = newObj;
                    this.render();
                    this.updateObjectCount();
                }
            });
        } else {
            this.objects.push(newObj);
            this.selectedObject = newObj;
            this.render();
            this.updateObjectCount();
        }
    },
    
    handleMouseMove(e) {
        if (!this.isDragging || !this.selectedObject) return;
        const rect = this.canvas.getBoundingClientRect();
        this.selectedObject.x = e.clientX - rect.left - this.dragStart.x;
        this.selectedObject.y = e.clientY - rect.top - this.dragStart.y;
        this.render();
    },
    
    handleMouseUp() {
        this.isDragging = false;
    },
    
    isPointInObject(px, py, obj) {
        const dx = px - obj.x;
        const dy = py - obj.y;
        return Math.sqrt(dx * dx + dy * dy) < obj.size / 2 + 10;
    },
    
    deleteSelected() {
        if (this.selectedObject) {
            this.objects = this.objects.filter(o => o.id !== this.selectedObject.id);
            this.selectedObject = null;
            this.render();
            this.updateObjectCount();
        }
    },
    
    clearAll() {
        Dialog.confirm('Clear Scene', 'Remove all objects from the scene?', () => {
            this.objects = [];
            this.selectedObject = null;
            this.render();
            this.updateObjectCount();
        });
    },
    
    updateObjectCount() {
        const el = document.getElementById('p3d-objects-count');
        if (el) el.textContent = `Objects: ${this.objects.length}`;
    },
    
    render() {
        if (!this.ctx) return;
        
        // Clear with gradient background
        const gradient = this.ctx.createRadialGradient(this.canvas.width / 2, this.canvas.height / 2, 0, this.canvas.width / 2, this.canvas.height / 2, this.canvas.width / 2);
        gradient.addColorStop(0, '#2a2a3e');
        gradient.addColorStop(1, '#1a1a2e');
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw grid
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        this.ctx.lineWidth = 1;
        for (let x = 0; x < this.canvas.width; x += 40) {
            this.ctx.beginPath();
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, this.canvas.height);
            this.ctx.stroke();
        }
        for (let y = 0; y < this.canvas.height; y += 40) {
            this.ctx.beginPath();
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(this.canvas.width, y);
            this.ctx.stroke();
        }
        
        // Draw objects
        this.objects.forEach(obj => {
            this.draw3DShape(obj, obj === this.selectedObject);
        });
    },
    
    draw3DShape(obj, isSelected) {
        const ctx = this.ctx;
        const { x, y, size, color, type } = obj;
        
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(x + 5, y + size / 2 + 10, size / 2, size / 6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw shape based on type
        switch (type) {
            case 'cube':
                this.drawCube(x, y, size, color);
                break;
            case 'sphere':
                this.drawSphere(x, y, size, color);
                break;
            case 'pyramid':
                this.drawPyramid(x, y, size, color);
                break;
            case 'cylinder':
                this.drawCylinder(x, y, size, color);
                break;
            case 'cone':
                this.drawCone(x, y, size, color);
                break;
            case 'text3d':
                this.draw3DText(x, y, size, color, obj.text || '3D');
                break;
        }
        
        // Selection highlight
        if (isSelected) {
            ctx.strokeStyle = '#4fc3f7';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.arc(x, y, size / 2 + 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    },
    
    drawCube(x, y, size, color) {
        const ctx = this.ctx;
        const s = size / 2;
        const offset = s / 3;
        
        // Top face
        ctx.fillStyle = this.lightenColor(color, 30);
        ctx.beginPath();
        ctx.moveTo(x, y - s);
        ctx.lineTo(x + s, y - s + offset);
        ctx.lineTo(x, y - s + offset * 2);
        ctx.lineTo(x - s, y - s + offset);
        ctx.closePath();
        ctx.fill();
        
        // Left face
        ctx.fillStyle = this.darkenColor(color, 20);
        ctx.beginPath();
        ctx.moveTo(x - s, y - s + offset);
        ctx.lineTo(x, y - s + offset * 2);
        ctx.lineTo(x, y + offset * 2);
        ctx.lineTo(x - s, y + offset);
        ctx.closePath();
        ctx.fill();
        
        // Right face
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x + s, y - s + offset);
        ctx.lineTo(x, y - s + offset * 2);
        ctx.lineTo(x, y + offset * 2);
        ctx.lineTo(x + s, y + offset);
        ctx.closePath();
        ctx.fill();
        
        // Edges
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y - s);
        ctx.lineTo(x + s, y - s + offset);
        ctx.lineTo(x, y - s + offset * 2);
        ctx.lineTo(x - s, y - s + offset);
        ctx.closePath();
        ctx.stroke();
    },
    
    drawSphere(x, y, size, color) {
        const ctx = this.ctx;
        const r = size / 2;
        
        const gradient = ctx.createRadialGradient(x - r / 3, y - r / 3, 0, x, y, r);
        gradient.addColorStop(0, this.lightenColor(color, 50));
        gradient.addColorStop(0.7, color);
        gradient.addColorStop(1, this.darkenColor(color, 40));
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    },
    
    drawPyramid(x, y, size, color) {
        const ctx = this.ctx;
        const s = size / 2;
        
        // Left face
        ctx.fillStyle = this.darkenColor(color, 20);
        ctx.beginPath();
        ctx.moveTo(x, y - s);
        ctx.lineTo(x - s, y + s / 2);
        ctx.lineTo(x, y + s / 3);
        ctx.closePath();
        ctx.fill();
        
        // Right face
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y - s);
        ctx.lineTo(x + s, y + s / 2);
        ctx.lineTo(x, y + s / 3);
        ctx.closePath();
        ctx.fill();
    },
    
    drawCylinder(x, y, size, color) {
        const ctx = this.ctx;
        const w = size / 2;
        const h = size;
        const ry = size / 6;
        
        // Body
        ctx.fillStyle = color;
        ctx.fillRect(x - w, y - h / 2, w * 2, h);
        
        // Top ellipse
        ctx.fillStyle = this.lightenColor(color, 30);
        ctx.beginPath();
        ctx.ellipse(x, y - h / 2, w, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Bottom ellipse
        ctx.fillStyle = this.darkenColor(color, 20);
        ctx.beginPath();
        ctx.ellipse(x, y + h / 2, w, ry, 0, 0, Math.PI);
        ctx.fill();
    },
    
    drawCone(x, y, size, color) {
        const ctx = this.ctx;
        const s = size / 2;
        
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y - s);
        ctx.lineTo(x + s, y + s / 2);
        ctx.lineTo(x - s, y + s / 2);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = this.darkenColor(color, 20);
        ctx.beginPath();
        ctx.ellipse(x, y + s / 2, s, s / 4, 0, 0, Math.PI * 2);
        ctx.fill();
    },
    
    draw3DText(x, y, size, color, text) {
        const ctx = this.ctx;
        const fontSize = size;
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // Shadow layers
        for (let i = 5; i > 0; i--) {
            ctx.fillStyle = this.darkenColor(color, 40);
            ctx.fillText(text, x + i, y + i);
        }
        
        // Main text
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        
        // Highlight
        ctx.fillStyle = this.lightenColor(color, 30);
        ctx.fillText(text, x - 1, y - 1);
    },
    
    lightenColor(hex, percent) {
        const num = parseInt(hex.replace('#', ''), 16);
        const r = Math.min(255, (num >> 16) + percent);
        const g = Math.min(255, ((num >> 8) & 0x00FF) + percent);
        const b = Math.min(255, (num & 0x0000FF) + percent);
        return `rgb(${r}, ${g}, ${b})`;
    },
    
    darkenColor(hex, percent) {
        const num = parseInt(hex.replace('#', ''), 16);
        const r = Math.max(0, (num >> 16) - percent);
        const g = Math.max(0, ((num >> 8) & 0x00FF) - percent);
        const b = Math.max(0, (num & 0x0000FF) - percent);
        return `rgb(${r}, ${g}, ${b})`;
    },
    
    saveScene() {
        if (!this.canvas) return;
        const link = document.createElement('a');
        link.download = 'zenos-3d-scene.png';
        link.href = this.canvas.toDataURL();
        link.click();
        Toast.show('Paint 3D', 'Scene saved as image.', 'success');
    }
};

                <button class="calculator-pro-btn operator" onclick="Apps.CalculatorPro.input('*')">×</button>
                
                <button class="calculator-pro-btn" onclick="Apps.CalculatorPro.input('4')">4</button>
                <button class="calculator-pro-btn" onclick="Apps.CalculatorPro.input('5')">5</button>
                <button class="calculator-pro-btn" onclick="Apps.CalculatorPro.input('6')">6</button>
                <button class="calculator-pro-btn operator" onclick="Apps.CalculatorPro.input('-')">−</button>
                
                <button class="calculator-pro-btn" onclick="Apps.CalculatorPro.input('1')">1</button>
                <button class="calculator-pro-btn" onclick="Apps.CalculatorPro.input('2')">2</button>
                <button class="calculator-pro-btn" onclick="Apps.CalculatorPro.input('3')">3</button>
                <button class="calculator-pro-btn operator" onclick="Apps.CalculatorPro.input('+')">+</button>
                
                <button class="calculator-pro-btn function" onclick="Apps.CalculatorPro.toggleSign()">±</button>
                <button class="calculator-pro-btn" onclick="Apps.CalculatorPro.input('0')">0</button>
                <button class="calculator-pro-btn" onclick="Apps.CalculatorPro.input('.')">.</button>
                <button class="calculator-pro-btn equals" onclick="Apps.CalculatorPro.calculate()">=</button>
            `;
        }
    },
    
    input(val) {
        if (this.display === '0' && !isNaN(val)) {
            this.expression = val;
        } else {
            this.expression += val;
        }
        this.display = this.expression;
        this.updateDisplay();
    },
    
    clearAll() {
        this.display = '0';
        this.expression = '';
        this.updateDisplay();
    },
    
    clearEntry() {
        this.display = '0';
        this.updateDisplay();
    },
    
    backspace() {
        this.expression = this.expression.slice(0, -1);
        this.display = this.expression || '0';
        this.updateDisplay();
    },
    
    toggleSign() {
        if (this.expression && !isNaN(this.expression)) {
            this.expression = String(-parseFloat(this.expression));
            this.display = this.expression;
            this.updateDisplay();
        }
    },
    
    calculate() {
        try {
            let expr = this.expression
                .replace(/Math\.PI/g, Math.PI)
                .replace(/Math\.E/g, Math.E)
                .replace(/\^/g, '**');
            
            const result = Function('"use strict"; return (' + expr + ')')();
            
            this.history.push(`${this.expression} = ${result}`);
            if (this.history.length > 5) this.history.shift();
            
            this.display = String(result);
            this.expression = String(result);
            this.updateDisplay();
        } catch (e) {
            this.display = 'Error';
            this.updateDisplay();
            setTimeout(() => {
                this.display = '0';
                this.expression = '';
                this.updateDisplay();
            }, 1000);
        }
    },
    
    sciFunc(func) {
        const val = parseFloat(this.expression) || 0;
        let result;
        const toRad = this.angleMode === 'deg' ? (v) => v * Math.PI / 180 : (v) => v;
        const fromRad = this.angleMode === 'deg' ? (v) => v * 180 / Math.PI : (v) => v;
        
        try {
            switch (func) {
                case 'sin': result = Math.sin(toRad(val)); break;
                case 'cos': result = Math.cos(toRad(val)); break;
                case 'tan': result = Math.tan(toRad(val)); break;
                case 'asin': result = fromRad(Math.asin(val)); break;
                case 'acos': result = fromRad(Math.acos(val)); break;
                case 'atan': result = fromRad(Math.atan(val)); break;
                case 'log': result = Math.log10(val); break;
                case 'ln': result = Math.log(val); break;
                case 'sqrt': result = Math.sqrt(val); break;
                case 'fact': result = this.factorial(Math.floor(val)); break;
            }
            this.expression = String(result);
            this.display = this.expression;
            this.updateDisplay();
        } catch (e) {
            this.display = 'Error';
            this.updateDisplay();
        }
    },
    
    factorial(n) {
        if (n < 0) return NaN;
        if (n <= 1) return 1;
        let result = 1;
        for (let i = 2; i <= n; i++) result *= i;
        return result;
    },
    
    memFunc(func) {
        switch (func) {
            case 'MC': this.memory = 0; break;
            case 'MR': this.expression = String(this.memory); this.display = this.expression; break;
            case 'M+': this.memory += parseFloat(this.expression) || 0; break;
            case 'M-': this.memory -= parseFloat(this.expression) || 0; break;
        }
        this.updateDisplay();
        Toast.show('Calculator', `Memory: ${this.memory}`, 'info');
    },
    
    updateDisplay() {
        const resultEl = document.getElementById('calc-pro-result');
        const exprEl = document.getElementById('calc-pro-expr');
        const histEl = document.getElementById('calc-pro-history');
        
        if (resultEl) resultEl.textContent = this.display;
        if (exprEl) exprEl.textContent = this.expression !== this.display ? this.expression : '';
        if (histEl) histEl.textContent = this.history.slice(-2).join(' | ');
    }
};

Apps.MusicVisualizer = {
    canvas: null,
    ctx: null,
    audioCtx: null,
    analyser: null,
    source: null,
    animationId: null,
    visualType: 'bars',
    isPlaying: false,
    fileInput: null,
    
    getHTML() {
        return `
            <div class="music-visualizer">
                <div class="music-visualizer-header">
                    <button class="music-visualizer-upload" onclick="Apps.MusicVisualizer.startDemo()">Start Demo Track</button>
                    <span class="music-visualizer-track-name" id="viz-track-name">Demo mode (no local files)</span>
                    <div class="music-visualizer-type">
                        <div class="music-visualizer-type-btn active" data-type="bars" onclick="Apps.MusicVisualizer.setType('bars')">Bars</div>
                        <div class="music-visualizer-type-btn" data-type="wave" onclick="Apps.MusicVisualizer.setType('wave')">Wave</div>
                        <div class="music-visualizer-type-btn" data-type="circle" onclick="Apps.MusicVisualizer.setType('circle')">Circle</div>
                        <div class="music-visualizer-type-btn" data-type="particles" onclick="Apps.MusicVisualizer.setType('particles')">Particles</div>
                    </div>
                </div>
                <canvas class="music-visualizer-canvas" id="viz-canvas"></canvas>
                <div class="music-visualizer-controls">
                    <div class="music-visualizer-play-btn" id="viz-play-btn" onclick="Apps.MusicVisualizer.togglePlay()">▶</div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="color: rgba(255,255,255,0.5); font-size: 12px;">Sensitivity:</span>
                        <input type="range" min="1" max="10" value="5" style="width: 100px;" oninput="Apps.MusicVisualizer.sensitivity = this.value">
                    </div>
                </div>
            </div>
        `;
    },
    
    sensitivity: 5,
    particles: [],
    
    init(windowId) {
        this.windowId = windowId;
        this.canvas = document.getElementById('viz-canvas');
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        
        if (this.canvas) {
            const resize = () => {
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
            };
            resize();
            window.addEventListener('resize', resize);
        }
        
        this.drawIdle();
    },
    
    loadFile() {
        Toast.show('Visualizer', 'Local file loading is disabled in this build.', 'warning');
    },
    
    togglePlay() {
        if (this.isPlaying) {
            this.pause();
        } else {
            this.play();
        }
    },
    
    play() {
        if (!this.audioBuffer) {
            // Use demo data if no file loaded
            this.startDemo();
            return;
        }
        
        if (this.source) {
            try { this.source.stop(); } catch (e) {}
        }
        
        this.analyser = this.audioCtx.createAnalyser();
        this.analyser.fftSize = 256;
        
        this.source = this.audioCtx.createBufferSource();
        this.source.buffer = this.audioBuffer;
        this.source.connect(this.analyser);
        this.analyser.connect(this.audioCtx.destination);
        this.source.start();
        
        this.isPlaying = true;
        document.getElementById('viz-play-btn').textContent = '⏸';
        this.visualize();
        
        this.source.onended = () => {
            this.isPlaying = false;
            document.getElementById('viz-play-btn').textContent = '▶';
            cancelAnimationFrame(this.animationId);
        };
    },
    
    pause() {
        if (this.source) {
            try { this.source.stop(); } catch (e) {}
        }
        this.isPlaying = false;
        document.getElementById('viz-play-btn').textContent = '▶';
        cancelAnimationFrame(this.animationId);
    },
    
    startDemo() {
        const trackName = document.getElementById('viz-track-name');
        if (trackName) trackName.textContent = 'Demo Track';
        this.audioBuffer = null;
        this.isPlaying = true;
        document.getElementById('viz-play-btn').textContent = '⏸';
        this.demoMode = true;
        this.demoPhase = 0;
        this.visualize();
    },
    
    setType(type) {
        this.visualType = type;
        document.querySelectorAll('.music-visualizer-type-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.type === type);
        });
    },
    
    visualize() {
        if (!this.ctx) return;
        
        const bufferLength = this.analyser ? this.analyser.frequencyBinCount : 128;
        const dataArray = new Uint8Array(bufferLength);
        
        const draw = () => {
            this.animationId = requestAnimationFrame(draw);
            
            if (this.analyser && !this.demoMode) {
                this.analyser.getByteFrequencyData(dataArray);
            } else {
                // Demo mode - generate fake data
                this.demoPhase += 0.05;
                for (let i = 0; i < bufferLength; i++) {
                    dataArray[i] = Math.floor(
                        (Math.sin(this.demoPhase + i * 0.2) * 0.5 + 0.5) * 200 +
                        Math.random() * 50
                    );
                }
            }
            
            const w = this.canvas.width;
            const h = this.canvas.height;
            
            // Clear with fade
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            this.ctx.fillRect(0, 0, w, h);
            
            switch (this.visualType) {
                case 'bars': this.drawBars(dataArray, w, h); break;
                case 'wave': this.drawWave(dataArray, w, h); break;
                case 'circle': this.drawCircle(dataArray, w, h); break;
                case 'particles': this.drawParticles(dataArray, w, h); break;
            }
        };
        
        draw();
    },
    
    drawBars(data, w, h) {
        const barWidth = w / data.length * 2.5;
        let x = 0;
        
        for (let i = 0; i < data.length; i++) {
            const barHeight = (data[i] / 255) * h * (this.sensitivity / 5);
            
            const hue = (i / data.length) * 360;
            this.ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.8)`;
            this.ctx.shadowBlur = 10;
            this.ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
            
            this.ctx.fillRect(x, h - barHeight, barWidth - 1, barHeight);
            
            // Mirror
            this.ctx.globalAlpha = 0.3;
            this.ctx.fillRect(x, h, barWidth - 1, barHeight / 3);
            this.ctx.globalAlpha = 1;
            
            x += barWidth;
        }
        this.ctx.shadowBlur = 0;
    },
    
    drawWave(data, w, h) {
        this.ctx.lineWidth = 3;
        this.ctx.strokeStyle = '#4fc3f7';
        this.ctx.shadowBlur = 15;
        this.ctx.shadowColor = '#4fc3f7';
        this.ctx.beginPath();
        
        const sliceWidth = w / data.length;
        let x = 0;
        
        for (let i = 0; i < data.length; i++) {
            const v = data[i] / 128.0;
            const y = (v * h / 2) * (this.sensitivity / 5);
            
            if (i === 0) {
                this.ctx.moveTo(x, y);
            } else {
                this.ctx.lineTo(x, y);
            }
            x += sliceWidth;
        }
        
        this.ctx.stroke();
        this.ctx.shadowBlur = 0;
    },
    
    drawCircle(data, w, h) {
        const cx = w / 2;
        const cy = h / 2;
        const radius = Math.min(w, h) / 4;
        
        for (let i = 0; i < data.length; i++) {
            const angle = (i / data.length) * Math.PI * 2;
            const amplitude = (data[i] / 255) * radius * (this.sensitivity / 5);
            const x1 = cx + Math.cos(angle) * radius;
            const y1 = cy + Math.sin(angle) * radius;
            const x2 = cx + Math.cos(angle) * (radius + amplitude);
            const y2 = cy + Math.sin(angle) * (radius + amplitude);
            
            const hue = (i / data.length) * 360;
            this.ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.8)`;
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.moveTo(x1, y1);
            this.ctx.lineTo(x2, y2);
            this.ctx.stroke();
        }
        
        // Center circle
        this.ctx.fillStyle = 'rgba(79, 195, 247, 0.3)';
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, radius / 2, 0, Math.PI * 2);
        this.ctx.fill();
    },
    
    drawParticles(data, w, h) {
        const avg = data.reduce((a, b) => a + b, 0) / data.length;
        
        // Add new particles based on audio
        if (avg > 50) {
            for (let i = 0; i < avg / 30; i++) {
                this.particles.push({
                    x: Math.random() * w,
                    y: h,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 8 - 2,
                    size: Math.random() * 5 + 2,
                    hue: Math.random() * 360,
                    life: 100
                });
            }
        }
        
        // Update and draw
        this.particles = this.particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.life--;
            
            if (p.life <= 0 || p.y > h) return false;
            
            this.ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.life / 100})`;
            this.ctx.shadowBlur = 10;
            this.ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            this.ctx.fill();
            
            return true;
        });
        
        this.ctx.shadowBlur = 0;
    },
    
    drawIdle() {
        if (!this.ctx) return;
        
        const w = this.canvas.width;
        const h = this.canvas.height;
        
        this.ctx.fillStyle = '#000';
        this.ctx.fillRect(0, 0, w, h);
        
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        this.ctx.font = '18px Segoe UI';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('Load an audio file or press Play for demo visualization', w / 2, h / 2);
    }
};

    renderMiniChart(data, color) {
        const max = Math.max(...data, 1);
        const w = 100;
        const h = 80;
        const points = data.map((v, i) => `${(i / (data.length - 1)) * w},${h - (v / max) * h}`).join(' ');
        
        return `
            <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width: 100%; height: 100%;">
                <defs>
                    <linearGradient id="grad-${color.replace('#', '')}" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="${color}" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <polygon points="0,${h} ${points} ${w},${h}" fill="url(#grad-${color.replace('#', '')})" />
                <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>
            </svg>
        `;
    },
    
    renderProcesses(container) {
        const processes = [];
        Object.values(ZenOS.windows).forEach((w, i) => {
            processes.push({
                pid: 1000 + i,
                name: w.title,
                user: 'h4ck3r',
                cpu: (Math.random() * 5).toFixed(1),
                mem: (Math.random() * 3).toFixed(1),
                status: 'Running'

        const hours = Math.floor(uptime / 3600);

    canvas: null,

        '#ffa07a', '#98fb98', '#87ceeb', '#dda0dd', '#f0e68c', '#d2691e'
    ],
    
    getHTML() {
        return `
            <div class="paint-app">
                <div class="paint-toolbar">

                        <div class="paint-tool-btn active" data-tool="pencil" onclick="Apps.PixelArt.setTool('pencil')">✏️</div>

                    </div>
                    <div class="paint-tool-separator"></div>
                    <div class="paint-color-picker" id="pixel-palette"></div>
                    <div class="paint-tool-separator"></div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 11px; color: rgba(255,255,255,0.5);">Grid:</span>

                            <option value="16">16x16</option>
                            <option value="32" selected>32x32</option>
                            <option value="64">64x64</option>
                        </select>
                    </div>
                    <div class="paint-tool-separator"></div>
                    <div class="paint-tool-btn" onclick="Apps.PixelArt.toggleGrid()">▦</div>
                    <div class="paint-tool-btn" onclick="Apps.PixelArt.undo()">↩️</div>
                    <div class="paint-tool-btn" onclick="Apps.PixelArt.clearCanvas()">🗑️</div>
                    <div class="paint-tool-btn" onclick="Apps.PixelArt.saveImage()">💾</div>
                    <div class="paint-tool-btn" onclick="Apps.PixelArt.exportSprite()">📤</div>
                </div>
                <div class="paint-canvas-container" style="background: repeating-conic-gradient(#e0e0e0 0% 25%, #fff 0% 50%) 50% / 20px 20px;">
                    <canvas class="paint-canvas" id="pixel-canvas" style="image-rendering: pixelated;"></canvas>
                </div>
                <div class="paint-statusbar">
                    <span id="pixel-tool-status">Tool: Pencil</span>
                    <span id="pixel-position">X: 0, Y: 0</span>
                    <span id="pixel-grid-size">Grid: 32x32</span>
                </div>
            </div>
        `;
    },
    
    showGrid: true,
    
    init(windowId) {
        this.windowId = windowId;
        this.canvas = document.getElementById('pixel-canvas');
        this.ctx = this.canvas.getContext('2d');
        
        this.initGrid();
        this.renderPalette();
        this.render();
        
        this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
        this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
        this.canvas.addEventListener('mouseup', () => this.isDrawing = false);
        this.canvas.addEventListener('mouseout', () => this.isDrawing = false);
    },
    
    initGrid() {
        this.canvas.width = this.gridSize * this.cellSize;
        this.canvas.height = this.gridSize * this.cellSize;
        this.grid = [];
        for (let y = 0; y < this.gridSize; y++) {
            this.grid[y] = [];
            for (let x = 0; x < this.gridSize; x++) {
                this.grid[y][x] = null;
            }
        }
        this.saveState();
    },
    
    setGridSize(size) {
        this.gridSize = parseInt(size);
        this.initGrid();
        this.render();
        document.getElementById('pixel-grid-size').textContent = `Grid: ${size}x${size}`;
    },
    
    renderPalette() {
        const container = document.getElementById('pixel-palette');
        if (!container) return;
        container.innerHTML = this.palette.map(c => `
            <div class="paint-color-swatch ${c === this.color ? 'active' : ''}" 
                 style="background: ${c}; width: 24px; height: 24px;" 
                 data-color="${c}" 
                 onclick="Apps.PixelArt.setColor('${c}')"></div>
        `).join('');
    },
    
    setTool(tool) {
        this.tool = tool;
        document.querySelectorAll('.paint-tool-btn[data-tool]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tool === tool);
        });
        document.getElementById('pixel-tool-status').textContent = `Tool: ${tool.charAt(0).toUpperCase() + tool.slice(1)}`;
    },
    
    setColor(color) {
        this.color = color;
        document.querySelectorAll('.paint-color-swatch').forEach(s => {
            s.classList.toggle('active', s.dataset.color === color);
        });
    },
    
    getCell(e) {
        const rect = this.canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / this.cellSize);
        const y = Math.floor((e.clientY - rect.top) / this.cellSize);
        return { x, y };
    },
    
    handleMouseDown(e) {
        const { x, y } = this.getCell(e);
        if (x < 0 || x >= this.gridSize || y < 0 || y >= this.gridSize) return;
        
        this.isDrawing = true;
        
        if (this.tool === 'fill') {
            this.floodFill(x, y, this.color);
        } else if (this.tool === 'picker') {
            if (this.grid[y][x]) this.setColor(this.grid[y][x]);
            this.isDrawing = false;
        } else {
            this.paint(x, y);
        }
        
        this.render();
    },
    
    handleMouseMove(e) {
        const { x, y } = this.getCell(e);
        const posEl = document.getElementById('pixel-position');
        if (posEl) posEl.textContent = `X: ${x}, Y: ${y}`;
        
        if (this.isDrawing && this.tool !== 'fill' && this.tool !== 'picker') {
            this.paint(x, y);
            this.render();
        }
    },
    
    paint(x, y) {
        if (x < 0 || x >= this.gridSize || y < 0 || y >= this.gridSize) return;
        this.grid[y][x] = this.tool === 'eraser' ? null : this.color;
    },
    
    floodFill(startX, startY, fillColor) {
        const targetColor = this.grid[startY][startX];
        if (targetColor === fillColor) return;
        
        const stack = [[startX, startY]];
        while (stack.length > 0) {
            const [x, y] = stack.pop();
            if (x < 0 || x >= this.gridSize || y < 0 || y >= this.gridSize) continue;
            if (this.grid[y][x] !== targetColor) continue;
            
            this.grid[y][x] = fillColor;
            stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        this.saveState();
    },
    
    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw grid
        if (this.showGrid) {
            this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            this.ctx.lineWidth = 1;
            for (let i = 0; i <= this.gridSize; i++) {
                this.ctx.beginPath();
                this.ctx.moveTo(i * this.cellSize, 0);
                this.ctx.lineTo(i * this.cellSize, this.canvas.height);
                this.ctx.stroke();
                this.ctx.beginPath();
                this.ctx.moveTo(0, i * this.cellSize);
                this.ctx.lineTo(this.canvas.width, i * this.cellSize);
                this.ctx.stroke();
            }
        }
        
        // Draw pixels
        for (let y = 0; y < this.gridSize; y++) {
            for (let x = 0; x < this.gridSize; x++) {
                if (this.grid[y][x]) {
                    this.ctx.fillStyle = this.grid[y][x];
                    this.ctx.fillRect(x * this.cellSize, y * this.cellSize, this.cellSize, this.cellSize);
                }
            }
        }
    },
    
    toggleGrid() {
        this.showGrid = !this.showGrid;
        this.render();
    },
    
    saveState() {
        this.historyIndex++;
        this.history = this.history.slice(0, this.historyIndex);
        this.history.push(JSON.parse(JSON.stringify(this.grid)));
        if (this.history.length > 50) {
            this.history.shift();
            this.historyIndex--;
        }
    },
    
    undo() {
        if (this.historyIndex > 0) {
            this.historyIndex--;
            this.grid = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
            this.render();
        }
    },
    
    clearCanvas() {
        Dialog.confirm('Clear Canvas', 'Clear all pixels?', () => {
            this.initGrid();
            this.render();
        });
    },
    
    saveImage() {
        const link = document.createElement('a');
        link.download = 'pixel-art.png';
        link.href = this.canvas.toDataURL();
        link.click();
        Toast.show('Pixel Art', 'Image saved!', 'success');
    },
    
    exportSprite() {
        const data = JSON.stringify(this.grid);
        const blob = new Blob([data], { type: 'application/json' });
        const link = document.createElement('a');
        link.download = 'sprite-data.json';
        link.href = URL.createObjectURL(blob);
        link.click();
        Toast.show('Pixel Art', 'Sprite data exported!', 'success');
    }
};
