    },
    
    play() {
        this.isPlaying = true;
        document.getElementById('mm-play-btn').textContent = '⏸ Pause';
        document.getElementById('mm-play-btn').className = 'settings-button danger';
        
        const stepTime = 60000 / this.tempo / 4;
        this.interval = setInterval(() => {
            this.playStep(this.currentStep);
            this.currentStep = (this.currentStep + 1) % this.steps;
            this.renderGrid();
        }, stepTime);
    },
    
    stop() {
        this.isPlaying = false;
        clearInterval(this.interval);
        this.currentStep = 0;
        document.getElementById('mm-play-btn').textContent = '▶ Play';
        document.getElementById('mm-play-btn').className = 'settings-button';
        this.renderGrid();
    },
    
    playStep(step) {
        for (let t = 0; t < this.tracks; t++) {
            if (this.pattern[t][step]) {
                this.playNote(this.instruments[t]);
            }
        }
    },
    
    playNote(instrument) {
        if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        const now = this.audioCtx.currentTime;
        const gain = this.audioCtx.createGain();
        gain.connect(this.audioCtx.destination);
        gain.gain.value = this.volume;
        
        switch (instrument) {
            case 'kick':
                this.playKick(now, gain);
                break;
            case 'snare':
                this.playSnare(now, gain);
                break;
            case 'hihat':
                this.playHihat(now, gain);
                break;
            case 'clap':
                this.playClap(now, gain);
                break;
            case 'bass':
                this.playBass(now, gain);
                break;
            case 'synth':
                this.playSynth(now, gain);
                break;
            case 'perc':
                this.playPerc(now, gain);
                break;
            case 'fx':
                this.playFx(now, gain);
                break;
        }
    },
    
    playKick(time, gain) {
        const osc = this.audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
        osc.connect(gain);
        osc.start(time);
        osc.stop(time + 0.5);
    },
    
    playSnare(time, gain) {
        const noise = this.audioCtx.createBufferSource();
        const bufferSize = this.audioCtx.sampleRate * 0.2;
        const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        noise.buffer = buffer;
        
        const filter = this.audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1000;
        
        noise.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
        noise.start(time);
        noise.stop(time + 0.2);
    },
    
    playHihat(time, gain) {
        const noise = this.audioCtx.createBufferSource();
        const bufferSize = this.audioCtx.sampleRate * 0.05;
        const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        noise.buffer = buffer;
        
        const filter = this.audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 7000;
        
        noise.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(0.5, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
        noise.start(time);
        noise.stop(time + 0.05);
    },
    
    playClap(time, gain) {
        for (let i = 0; i < 3; i++) {
            const noise = this.audioCtx.createBufferSource();
            const bufferSize = this.audioCtx.sampleRate * 0.02;
            const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let j = 0; j < bufferSize; j++) {
                data[j] = Math.random() * 2 - 1;
            }
            noise.buffer = buffer;
            
            const filter = this.audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 2500;
            
            noise.connect(filter);
            filter.connect(gain);
            gain.gain.setValueAtTime(0.8, time + i * 0.01);
            gain.gain.exponentialRampToValueAtTime(0.01, time + i * 0.01 + 0.02);
            noise.start(time + i * 0.01);
            noise.stop(time + i * 0.01 + 0.02);
        }
    },
    
    playBass(time, gain) {
        const osc = this.audioCtx.createOscillator();
        osc.type = 'sawtooth';
        const notes = [55, 65.41, 73.42, 82.41, 98, 110, 123.47, 146.83];
        osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
        
        const filter = this.audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, time);
        filter.frequency.exponentialRampToValueAtTime(100, time + 0.3);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(0.6, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
        osc.start(time);
        osc.stop(time + 0.3);
    },
    
    playSynth(time, gain) {
        const notes = [261.63, 293.66, 329.63, 349.23, 392, 440, 493.88, 523.25];
        const freq = notes[Math.floor(Math.random() * notes.length)];
        
        const osc1 = this.audioCtx.createOscillator();
        const osc2 = this.audioCtx.createOscillator();
        osc1.type = 'square';
        osc2.type = 'sawtooth';
        osc1.frequency.value = freq;
        osc2.frequency.value = freq * 1.005;
        
        const filter = this.audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3000, time);
        filter.frequency.exponentialRampToValueAtTime(300, time + 0.4);
        
        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(0.3, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.4);
        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + 0.4);
        osc2.stop(time + 0.4);
    },
    
    playPerc(time, gain) {
        const osc = this.audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, time);
        osc.frequency.exponentialRampToValueAtTime(200, time + 0.1);
        gain.gain.setValueAtTime(0.4, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
        osc.connect(gain);
        osc.start(time);
        osc.stop(time + 0.1);
    },
    
    playFx(time, gain) {
        const osc = this.audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(2000, time);
        osc.frequency.exponentialRampToValueAtTime(100, time + 0.5);
        gain.gain.setValueAtTime(0.3, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
        osc.connect(gain);
        osc.start(time);
        osc.stop(time + 0.5);
    },
    
    setTempo(value) {
        this.tempo = parseInt(value);
        document.getElementById('mm-tempo').textContent = `${value} BPM`;
        if (this.isPlaying) {
            this.stop();
            this.play();
        }
    },
    
    clearPattern() {
        this.initPattern();
        this.renderGrid();
        Toast.show('Music Maker', 'Pattern cleared.', 'info');
    },
    
    randomize() {
        for (let t = 0; t < this.tracks; t++) {
            for (let s = 0; s < this.steps; s++) {
                this.pattern[t][s] = Math.random() < 0.3;
            }
        }
        this.renderGrid();
        Toast.show('Music Maker', 'Random pattern generated!', 'success');
    },
    
    exportPattern() {
        const data = JSON.stringify({
            tempo: this.tempo,
            pattern: this.pattern,
            instruments: this.instruments
        }, null, 2);
        
        const blob = new Blob([data], { type: 'application/json' });
        const link = document.createElement('a');
        link.download = 'zenos-pattern.json';
        link.href = URL.createObjectURL(blob);
        link.click();
        Toast.show('Music Maker', 'Pattern exported!', 'success');
    }
};

// ========================================================================
// ADDITIONAL APPS - CODE EDITOR (IDE)
// ========================================================================
Apps.CodeEditor = {
    files: {
        'index.html': '<!DOCTYPE html>\n<html>\n<head>\n    <title>My Website</title>\n    <!--STYLE-->\n</head>\n<body>\n    <h1>Hello World!</h1>\n    <p>Welcome to my website.</p>\n    <!--SCRIPT-->\n</body>\n</html>',
        'style.css': 'body {\n    font-family: Arial, sans-serif;\n    margin: 0;\n    padding: 20px;\n    background: #f0f0f0;\n}\n\nh1 {\n    color: #333;\n}\n\np {\n    color: #666;\n    line-height: 1.6;\n}',
        'script.js': '// My JavaScript file\nconsole.log("Hello from ZenOS!");\n\nfunction greet(name) {\n    return `Hello, ${name}!`;\n}\n\ndocument.addEventListener("DOMContentLoaded", () => {\n    console.log(greet("World"));\n});',
        'README.md': '# My Project\n\nThis is a sample project in ZenOS Code Editor.\n\n## Features\n- HTML editing\n- CSS styling\n- JavaScript coding\n\n## Getting Started\nOpen any file from the sidebar to start editing.'
    },
    activeFile: 'index.html',
    
    getHTML() {
        return `
            <div style="display: flex; height: 100%;">
                <div style="width: 200px; background: rgba(20, 20, 35, 0.8); border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column;">
                    <div style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px;">Explorer</span>
                        <span style="cursor: pointer; color: rgba(255,255,255,0.5);" onclick="Apps.CodeEditor.newFile()">+</span>
                    </div>
                    <div style="flex: 1; overflow-y: auto; padding: 5px 0;" id="ce-file-list"></div>
                </div>
                <div style="flex: 1; display: flex; flex-direction: column;">
                    <div style="height: 36px; background: rgba(30, 30, 50, 0.8); border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; padding: 0 10px;" id="ce-tabs"></div>
                    <div style="height: 32px; background: rgba(25, 25, 40, 0.8); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; padding: 0 10px; gap: 10px;">
                        <button class="settings-button secondary" style="padding: 4px 10px; font-size: 11px;" onclick="Apps.CodeEditor.runCode()">▶ Run</button>
                        <button class="settings-button secondary" style="padding: 4px 10px; font-size: 11px;" onclick="Apps.CodeEditor.formatCode()">Format</button>
                        <button class="settings-button secondary" style="padding: 4px 10px; font-size: 11px;" onclick="Apps.CodeEditor.saveFile()">💾 Save</button>
                        <div style="margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.4);" id="ce-status">Ready</div>
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                        <div style="flex: 1; display: flex; overflow: hidden;">
                            <div style="width: 50px; background: rgba(15, 15, 25, 0.8); padding: 10px 5px; text-align: right; font-family: monospace; font-size: 13px; color: rgba(255,255,255,0.3); overflow: hidden;" id="ce-line-numbers"></div>
                            <textarea style="flex: 1; background: rgba(10, 10, 20, 0.9); border: none; outline: none; color: #e0e0e0; font-family: 'Consolas', monospace; font-size: 14px; line-height: 1.6; padding: 10px; resize: none; tab-size: 4;" id="ce-editor" spellcheck="false" oninput="Apps.CodeEditor.onEditorInput()" onscroll="Apps.CodeEditor.syncScroll()"></textarea>
                        </div>
                        <div style="height: 200px; background: rgba(5, 5, 15, 0.95); border-top: 1px solid rgba(255,255,255,0.1); overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; color: #00ff41;" id="ce-output">
                            <div style="color: rgba(255,255,255,0.3);">// Output will appear here when you run code</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    },
    
    init(windowId) {
        this.windowId = windowId;
        this.renderFileList();
        this.renderTabs();
        this.loadFile(this.activeFile);
    },
    
    renderFileList() {
        const container = document.getElementById('ce-file-list');
        if (!container) return;
        
        container.innerHTML = Object.keys(this.files).map(name => {
            const icon = name.endsWith('.html') ? '🌐' : name.endsWith('.css') ? '🎨' : name.endsWith('.js') ? '📜' : '📄';
            return `<div style="padding: 6px 15px; font-size: 12px; color: ${name === this.activeFile ? '#4fc3f7' : 'rgba(255,255,255,0.7)'}; cursor: pointer; display: flex; align-items: center; gap: 8px;" 
                          onclick="Apps.CodeEditor.loadFile('${name}')"
                          onmouseover="this.style.background='rgba(255,255,255,0.05)'"
                          onmouseout="this.style.background=''">
                <span>${icon}</span>
                <span>${name}</span>
            </div>`;
        }).join('');
    },
    
    renderTabs() {
        const container = document.getElementById('ce-tabs');
        if (!container) return;
        
        container.innerHTML = Object.keys(this.files).map(name => `
            <div style="padding: 8px 15px; font-size: 12px; color: ${name === this.activeFile ? '#fff' : 'rgba(255,255,255,0.5)'}; background: ${name === this.activeFile ? 'rgba(79,195,247,0.1)' : 'transparent'}; cursor: pointer; border-bottom: 2px solid ${name === this.activeFile ? '#4fc3f7' : 'transparent'}; display: flex; align-items: center; gap: 8px;"
                 onclick="Apps.CodeEditor.loadFile('${name}')">
                <span>${name}</span>
            </div>
        `).join('');
    },
    
    loadFile(name) {
        if (!this.files[name]) return;
        this.activeFile = name;
        
        const editor = document.getElementById('ce-editor');
        if (editor) {
            editor.value = this.files[name];
            this.updateLineNumbers();
        }
        
        this.renderFileList();
        this.renderTabs();
    },
    
    onEditorInput() {
        const editor = document.getElementById('ce-editor');
        if (editor) {
            this.files[this.activeFile] = editor.value;
            this.updateLineNumbers();
        }
    },
    
    updateLineNumbers() {
        const editor = document.getElementById('ce-editor');
        const lineNumbers = document.getElementById('ce-line-numbers');
        if (!editor || !lineNumbers) return;
        
        const lines = editor.value.split('\n').length;
        let html = '';
        for (let i = 1; i <= lines; i++) {
            html += `<div style="height: 22.4px; line-height: 22.4px;">${i}</div>`;
        }
        lineNumbers.innerHTML = html;
    },
    
    syncScroll() {
        const editor = document.getElementById('ce-editor');
        const lineNumbers = document.getElementById('ce-line-numbers');
        if (editor && lineNumbers) {
            lineNumbers.scrollTop = editor.scrollTop;
        }
    },
    
    saveFile() {
        localStorage.setItem(`zenos-code-${this.activeFile}`, this.files[this.activeFile]);
        Toast.show('Code Editor', `${this.activeFile} saved!`, 'success');
    },
    
    newFile() {
        Dialog.prompt('New File', 'Enter filename:', '', (name) => {
            if (name) {
                if (this.files[name]) {
                    Toast.show('Error', 'File already exists.', 'error');
                    return;
                }
                this.files[name] = '';
                this.loadFile(name);
                Toast.show('Code Editor', `Created ${name}`, 'success');
            }
        });
    },
    
    runCode() {
        const output = document.getElementById('ce-output');
        if (!output) return;
        
        output.innerHTML = '<div style="color: #4fc3f7;">▶ Running code...</div>';
        
        if (this.activeFile.endsWith('.js')) {
            const logs = [];
            const originalLog = console.log;
            console.log = (...args) => {
                logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
            };
            
            try {
                eval(this.files[this.activeFile]);
                console.log = originalLog;
                output.innerHTML = logs.map(l => `<div style="color: #00ff41;">${l}</div>`).join('') || '<div style="color: rgba(255,255,255,0.3);">// No output</div>';
            } catch (e) {
                console.log = originalLog;
                output.innerHTML = `<div style="color: #ff5f57;">Error: ${e.message}</div>`;
            }
        } else if (this.activeFile.endsWith('.html')) {
            const preview = window.open('', '_blank', 'width=800,height=600');
            if (preview) {
                const css = this.files['style.css'] || '';
                const js = this.files['script.js'] || '';
                let html = this.files[this.activeFile];
                html = html.replace('<!--STYLE-->', `<style>${css}</style>`);
                html = html.replace('<!--SCRIPT-->', `<script>${js}<\/script>`);
                preview.document.write(html);
                preview.document.close();
                output.innerHTML = '<div style="color: #28c940;">HTML preview opened in new window.</div>';
            }
        } else {
            output.innerHTML = '<div style="color: #ffbd2e;">Run not supported for this file type.</div>';
        }
        
        document.getElementById('ce-status').textContent = 'Executed';
        setTimeout(() => {
            document.getElementById('ce-status').textContent = 'Ready';
        }, 2000);
    },
    
    formatCode() {
        const editor = document.getElementById('ce-editor');
        if (!editor) return;
        
        let code = editor.value;
        
        if (this.activeFile.endsWith('.js') || this.activeFile.endsWith('.css')) {
            // Simple formatting
            code = code.replace(/\s*{\s*/g, ' {\n    ');
            code = code.replace(/\s*}\s*/g, '\n}\n');
            code = code.replace(/;\s*/g, ';\n    ');
            code = code.replace(/\n\s*\n/g, '\n\n');
        }
        
        editor.value = code;
        this.files[this.activeFile] = code;
        this.updateLineNumbers();
        Toast.show('Code Editor', 'Code formatted!', 'success');
    }
};

ZenOS.installedApps.push('pixel-art', 'music-maker', 'code-editor');

// Extend AppManager
const originalGetContent = AppManager.getContent;
AppManager.getContent = function(appId) {
    switch (appId) {
        case 'pixel-art': return Apps.PixelArt.getHTML();
        case 'music-maker': return Apps.MusicMaker.getHTML();
        case 'code-editor': return Apps.CodeEditor.getHTML();
        default: return originalGetContent.call(this, appId);
    }
};

const originalInit = AppManager.initialize;
AppManager.initialize = function(appId, windowId) {
    setTimeout(() => {
        switch (appId) {
            case 'pixel-art': Apps.PixelArt.init(windowId); break;
            case 'music-maker': Apps.MusicMaker.init(windowId); break;
            case 'code-editor': Apps.CodeEditor.init(windowId); break;
            default: originalInit.call(this, appId, windowId); break;
        }
    }, 50);
};
