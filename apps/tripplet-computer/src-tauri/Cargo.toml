[package]
name         = "tripplet-computer"
version      = "0.1.0"
description  = "Tripplet Computer — a local agent workstation for macOS"
authors      = ["Tripplet"]
edition      = "2021"
rust-version = "1.77"
license      = "MIT"

# The binary is `tripplet-computer`; everything real lives in the lib so the
# unit tests (and, later, a headless CLI harness) can link against it.
[lib]
name       = "tripplet_computer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tripplet-computer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener  = "2"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

tokio        = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util"] }
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }

rusqlite = { version = "0.32", features = ["bundled"] }

# Per-install identity: an Ed25519 keypair the app signs every request with.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core     = { version = "0.6", features = ["getrandom"] }
sha2          = "0.10"
hmac          = "0.12"
base64        = "0.22"

anyhow    = "1"
thiserror = "1"
uuid      = { version = "1", features = ["v4", "serde"] }
chrono    = { version = "0.4", features = ["serde"] }
dirs      = "5"
once_cell = "1"
parking_lot = "0.12"
regex     = "1"
ignore    = "0.4"
urlencoding = "2"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
